<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Software Factory</title>
<link rel="icon" id="fav" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2320222c'/%3E%3Cpath d='M6 25V15l7 4v-4l7 4V8h4v17z' fill='%238be9fd'/%3E%3C/svg%3E">

<style>
  :root {
    --bg: #14151b;
    --panel: #1a1c24;
    --card: #20222c;
    --card-hover: #252835;
    --line: #2b2e3b;
    --text: #e4e5ea;
    --muted: #a3a8bd;      /* secondary text, 6.2:1 or better on every surface */
    --subtle: #969bb1;     /* captions and timestamps, 5.3:1 or better */
    --faint: #5b6075;      /* decoration only, never information */
    --active: #8be9fd;
    --pass: #50fa7b;
    --changes: #ffb86c;
    --human: #ff5555;
    --merged: #bd93f9;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  a, button, summary, input { transition: background-color .18s, border-color .18s, color .18s; }
  :where(a, button, input, summary, [tabindex]):focus-visible { outline: 2px solid var(--active); outline-offset: 2px; border-radius: 4px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .seg-btn, .more, .close, .file, .tlink { cursor: pointer; }
  .seg-btn:hover, .more:hover { color: var(--text); border-color: var(--muted); }

  /* Header */
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 8px 16px;
    flex-wrap: wrap; padding: 24px 32px 8px;
  }
  h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .back { font-size: 13px; font-weight: 400; color: var(--muted); text-decoration: none; margin-right: 14px; white-space: nowrap; }
  .back:hover { color: var(--active); }
  .back:focus-visible { outline: 2px solid var(--active); outline-offset: 2px; border-radius: 4px; }
  .back[hidden] { display: none; }
  .status { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .status.wait { color: var(--changes); }
  .status.wait .dot { background: var(--changes); }
  .status .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--pass); margin-right: 6px; vertical-align: 1px;
  }
  .status.error { color: var(--human); }
  .status.error .dot { background: var(--human); }
  .banner {
    margin: 12px 32px 0; padding: 10px 14px; border: 1px solid var(--human);
    border-radius: 8px; color: var(--human); font-family: var(--mono); font-size: 12px;
  }

  /* Board */
  .board { padding: 20px 32px 40px; }
  .board[hidden] { display: none; }
  .empty { color: var(--subtle); font-size: 12px; padding: 4px 2px; }

  /* Cards */
  .card {
    display: block; width: 100%; text-align: left; cursor: pointer; color: inherit;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 12px 10px; margin-bottom: 10px;
    transition: background .15s, border-color .15s, transform .15s;
  }
  .card:hover { background: var(--card-hover); transform: translateY(-1px); }
  .prow:focus-visible, .drow:focus-visible { outline-offset: -2px; }
  .card:focus-visible { outline: 2px solid var(--active); outline-offset: 2px; }
  .card.live { border-color: color-mix(in srgb, var(--active) 35%, var(--line)); }
  .card.human {
    border-color: var(--human);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--human) 40%, transparent),
                0 8px 24px -12px color-mix(in srgb, var(--human) 60%, transparent);
  }
  .card.done { opacity: .72; }
  .card.rejected .feature { text-decoration: line-through; text-decoration-color: var(--subtle); }
  .flag.wait { color: var(--changes); }
  .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .num { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .card-top .num { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pulse {
    width: 7px; height: 7px; border-radius: 50%; background: var(--active);
    animation: pulse 1.6s ease-in-out infinite;
  }
  .flag {
    margin-left: auto; font-size: 12px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: var(--human); white-space: nowrap;
  }
  .feature { font-size: 13px; line-height: 1.4; margin: 0 0 6px; }
  .links { display: flex; gap: 10px; font-family: var(--mono); font-size: 12px; }
  .links a { color: var(--active); text-decoration: none; }
  .links a:hover { text-decoration: underline; }
  .meta { display: flex; gap: 10px; margin-top: 8px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .meta .risk-high { color: var(--human); } .meta .risk-medium { color: var(--changes); }
  .chip.gate { flex: 0 0 38px; }
  .chip.FAIL { border: 1px solid transparent; color: var(--human); background: color-mix(in srgb, var(--human) 16%, transparent); }
  .branch {
    font-family: var(--mono); font-size: 12px; color: var(--subtle);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .rounds { margin-top: 10px; display: grid; gap: 5px; }
  .round { display: flex; align-items: center; gap: 4px; }
  .round .r { font-family: var(--mono); font-size: 12px; color: var(--subtle); width: 20px; }
  .chip {
    flex: 1; text-align: center; font-family: var(--mono); font-size: 12px;
    padding: 2px 0; border-radius: 4px; border: 1px dashed var(--faint); color: var(--subtle);
  }
  .chip.wait { animation: breathe 1.6s ease-in-out infinite; }
  .chip.PASS {
    border: 1px solid transparent; color: var(--pass);
    background: color-mix(in srgb, var(--pass) 14%, transparent);
  }
  .chip.CHANGES {
    border: 1px solid transparent; color: var(--changes);
    background: color-mix(in srgb, var(--changes) 16%, transparent);
  }
  .chip.bad { border: 1px solid var(--human); color: var(--human); }
  .hint {
    margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line);
    font-family: var(--mono); font-size: 12px; color: var(--muted); line-height: 1.6;
    overflow-wrap: anywhere;
  }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    .card:hover { transform: none; }
  }

  /* Drawer */
  .scrim {
    position: fixed; inset: 0; z-index: 30; background: rgba(5, 6, 10, .55);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 31; width: min(920px, 100vw);
    background: var(--panel); border-left: 1px solid var(--line);
    display: grid; grid-template-rows: auto minmax(0, 1fr); transform: translateX(100%); overflow: hidden;
    transition: transform .25s ease;
  }
  .open .scrim { opacity: 1; pointer-events: auto; }
  .open .drawer { transform: none; }
  .d-head { padding: 20px 24px 16px; border-bottom: 1px solid var(--line); position: relative; }
  .d-head .num { font-size: 12px; }
  .d-head h3 { margin: 4px 40px 6px 0; font-size: 16px; font-weight: 600; line-height: 1.35; }
  .close {
    position: absolute; top: 16px; right: 16px; width: 36px; height: 36px;
    border-radius: 8px; border: 1px solid var(--line); background: none; cursor: pointer;
    color: var(--muted); font-size: 18px; line-height: 1;
  }
  .close:hover { color: var(--text); border-color: var(--muted); }
  .d-body { display: grid; grid-template-columns: 200px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); min-height: 0; }
  .files { border-right: 1px solid var(--line); padding: 14px 10px; overflow-y: auto; }
  .files .group {
    font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--subtle); margin: 12px 8px 4px;
  }
  .files .group:first-child { margin-top: 0; }
  .file {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: none; border: 0; border-radius: 6px; padding: 5px 8px; cursor: pointer;
    font-family: var(--mono); font-size: 12px; color: var(--muted);
  }
  .file:hover { background: var(--card); color: var(--text); }
  .file.on { background: var(--card-hover); color: var(--text); }
  .file .rn { display: none; }
  .file .v { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); flex: none; }
  .v.good { background: var(--pass); } .v.warn { background: var(--changes); } .v.stop { background: var(--human); }
  .doc { overflow-y: auto; padding: 22px 28px 60px; min-width: 0; }

  /* Rendered markdown */
  .md { max-width: 680px; line-height: 1.65; }
  .md h1, .md h2, .md h3, .md h4 { line-height: 1.3; margin: 1.6em 0 .5em; }
  .md h1 { font-size: 20px; } .md h2 { font-size: 15px; } .md h3 { font-size: 14px; color: var(--muted); }
  .md > :first-child { margin-top: 0; }
  .md p, .md ul, .md ol, .md blockquote, .md pre, .md table { margin: 0 0 .9em; }
  .md ul, .md ol { padding-left: 1.3em; }
  .md li { margin: .2em 0; }
  .md li.task { list-style: none; margin-left: -1.3em; }
  .md li.task::before { content: "☐"; margin-right: .5em; color: var(--subtle); }
  .md li.task.done::before { content: "☑"; color: var(--pass); }
  .md code {
    font-family: var(--mono); font-size: 12px; background: var(--card);
    padding: 1px 5px; border-radius: 4px;
  }
  .md pre {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 14px; overflow-x: auto;
  }
  .md pre code { background: none; padding: 0; }
  .md blockquote { border-left: 2px solid var(--line); padding-left: 12px; color: var(--muted); }
  .md a { color: var(--active); }
  .md table { border-collapse: collapse; font-size: 13px; display: block; overflow-x: auto; }
  .tlink { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-decoration: underline; cursor: pointer; }
  .md table.costs td.n, .md table.costs th.n { text-align: right; font-family: var(--mono); font-size: 12px; white-space: nowrap; }
  .md table.costs tfoot td { font-weight: 600; }
  .md table.costs .bar { display: inline-block; width: 40px; height: 6px; margin-right: 6px; vertical-align: middle;
    border-radius: 3px; background: linear-gradient(90deg, var(--muted) var(--w), var(--line) var(--w)); }
  .md th, .md td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; }
  .verdict {
    display: inline-block; font-family: var(--mono); font-size: 12px; font-weight: 600;
    padding: 4px 10px; border-radius: 6px; margin-bottom: 14px;
  }
  .verdict + * { margin-top: .4em; }
  .md .head { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: -6px 0 14px; white-space: pre-line; }
  .verdict.good { color: var(--pass); background: color-mix(in srgb, var(--pass) 14%, transparent); }
  .verdict.warn { color: var(--changes); background: color-mix(in srgb, var(--changes) 16%, transparent); }
  .verdict.stop { color: var(--human); background: color-mix(in srgb, var(--human) 16%, transparent); }
  .note { color: var(--subtle); font-size: 13px; }
  .md .summary {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 16px 4px; margin: 0 0 22px;
  }
  .md .summary h2 {
    margin: 0 0 6px; font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .08em; color: var(--muted);
  }
  .md .summary ul { margin: 0 0 .6em; }

  /* Views */
  nav.views { display: flex; gap: 4px; margin-right: auto; margin-left: 18px; }
  nav.views a {
    color: var(--muted); text-decoration: none; font-size: 13px; padding: 3px 10px;
    border-radius: 6px; border: 1px solid transparent;
  }
  nav.views a.on { color: var(--text); border-color: var(--line); background: var(--panel); }
  .costs-view { padding: 20px 32px 40px; max-width: 1400px; }
  .costs-view[hidden], .board[hidden] { display: none; }
  .costs-view h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 28px 0 10px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .tile .v { font-family: var(--mono); font-size: 20px; font-weight: 600; }
  .tile .k { color: var(--muted); font-size: 12px; }
  .tile .s { color: var(--subtle); font-size: 12px; font-family: var(--mono); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(560px, 1fr)); gap: 0 28px; }
  .grid2 > * { min-width: 0; }
  .costs-view table.costs th, .costs-view table.costs td { white-space: nowrap; }
  .md table.costs th[data-sort] { cursor: pointer; user-select: none; }
  .md table.costs th[data-sort].on { color: var(--active); }
  .md table.costs tr[data-job] { cursor: pointer; }
  .md table.costs tr[data-job]:hover td { background: var(--card-hover); }
  .md table.costs td.t { max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .md table.costs .stage-merged { color: var(--merged); }
  .md table.costs .stage-rejected { color: var(--subtle); }
  .md table.costs .stage-human { color: var(--human); }

  footer {
    padding: 0 32px 32px; font-family: var(--mono); font-size: 12px; color: var(--subtle);
    display: flex; gap: 20px; flex-wrap: wrap;
  }

  /* Sections and the done list */
  .sec-h { display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px; }
  .sec-h h2 { margin: 0; font-size: 13px; font-weight: 600; }
  .sec-h .count { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .sec-h .tools { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .seg-btn { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 6px;
    padding: 2px 9px; font-size: 12px; cursor: pointer; }
  .seg-btn.on { color: var(--text); background: var(--card); border-color: var(--muted); }
  .search { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; color: var(--text);
    padding: 3px 9px; font: 12px var(--mono); width: 180px; }
  .tag { font-family: var(--mono); font-size: 12px; color: var(--merged); background: color-mix(in srgb, var(--merged) 12%, transparent);
    padding: 1px 6px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
  .rdots { display: inline-flex; gap: 3px; align-items: center; }
  .rd { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--faint); }
  .rd.pass { background: var(--pass); } .rd.changes { background: var(--changes); } .rd.fail { background: var(--human); }
  .rd.human { background: none; box-shadow: inset 0 0 0 2px var(--human); } .rd.live { background: var(--active); animation: pulse 1.6s infinite; }
  .rd.muted { background: var(--faint); }
  .risk-high { color: var(--human); } .risk-medium { color: var(--changes); } .risk-low { color: var(--muted); }
  .day { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--subtle); margin: 14px 0 4px; }
  .drow { display: grid; grid-template-columns: 8px 32px minmax(0, 1fr) auto auto 56px 62px 52px; gap: 10px; align-items: center;
    padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .drow:hover { background: var(--card); }
  .drow .dt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .drow:hover .dt { color: var(--text); }
  .drow .n { text-align: right; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .drow > span:nth-child(6) { font-family: var(--mono); font-size: 12px; }
  .sd { width: 8px; height: 8px; border-radius: 2px; background: var(--merged); }
  .sd.rejected { background: var(--faint); }
  .drow.rejected .dt { color: var(--subtle); }
  .stg { display: inline-block; font: 12px/1.5 var(--mono); padding: 0 7px; border-radius: 4px; margin-right: 6px; white-space: nowrap; color: var(--muted); box-shadow: inset 0 0 0 1px var(--faint); }
  .more { background: none; border: 0; color: var(--active); font: 12px var(--mono); cursor: pointer; padding: 8px 10px; }
  .calm { color: var(--subtle); font-size: 13px; padding: 10px 0; }

  /* Needs you, running */
  .b-sec { margin-bottom: 34px; }
  .attn { border: 1px solid color-mix(in srgb, var(--human) 45%, var(--line)); border-radius: 12px; padding: 14px 16px 6px;
    background: color-mix(in srgb, var(--human) 5%, var(--bg)); }
  .attn .sec-h h2 { color: var(--human); }
  .attn.calm-box { border-color: var(--line); background: none; padding: 10px 16px; }
  .attn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  .prow { display: grid; grid-template-columns: minmax(220px, 1.2fr) minmax(400px, 2fr) minmax(170px, .8fr); gap: 20px; align-items: center;
    background: var(--card); border: 1px solid color-mix(in srgb, var(--active) 30%, var(--line)); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 8px; cursor: pointer; }
  .prow:hover { background: var(--card-hover); }
  .segs { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .seg { height: 6px; border-radius: 3px; background: var(--line); position: relative; }
  .seg span { position: absolute; top: 10px; left: 0; font-size: 12px; color: var(--subtle); font-family: var(--mono); }
  .seg.done { background: color-mix(in srgb, var(--active) 45%, var(--line)); }
  .seg.skip { background: repeating-linear-gradient(45deg, var(--line) 0 3px, transparent 3px 6px); }
  .seg.cur { background: var(--active); animation: breathe 1.6s infinite; }
  .seg.cur span { color: var(--active); font-weight: 600; }
  /* A split job's build: one bar per slice instead of one segment. */
  .seg.slices { display: flex; gap: 2px; background: none; animation: none; }
  .seg.slices i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
  .seg.slices i.done { background: color-mix(in srgb, var(--active) 45%, var(--line)); }
  .seg.slices i.running { background: var(--active); animation: breathe 1.6s infinite; }
  .seg.slices i.blocked { background: var(--human); }
  .pnow { margin-top: 30px; font: 12px var(--mono); color: var(--muted); }
  .pnow b { color: var(--text); font-weight: 600; }
  .pside .meta { margin-top: 8px; }

  /* Costs view */
  .cv h2 { margin: 30px 0 4px; }
  .cv .sub { color: var(--subtle); font-size: 12px; margin: 0 0 12px; }
  .bcol .fee { position: absolute; left: -2px; right: -2px; border-top: 2px solid var(--text); pointer-events: none; }
  .legend i.fee-key { height: 0; border-top: 2px solid var(--text); border-radius: 0; vertical-align: 3px; }
  .tile.click { cursor: pointer; } .tile.click:hover { background: var(--card-hover); }
  .tile .k2 { color: var(--text); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .up { color: var(--changes); } .down { color: var(--pass); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .chart { position: relative; height: 240px; margin: 0 92px 0 44px; border-bottom: 1px solid var(--muted); }
  .chart .gl { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); }
  .chart .gl span { position: absolute; right: calc(100% + 8px); top: -8px; font: 10.5px var(--mono); color: var(--subtle); }
  .chart .med { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--text); opacity: .55; z-index: 1; pointer-events: none; }
  .chart .med span { position: absolute; left: calc(100% + 8px); top: -8px; font: 10.5px/1.3 var(--mono); color: var(--text); white-space: pre; }
  .bars { position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 4px; }
  .bcol { flex: 1; height: 100%; display: flex; align-items: flex-end; cursor: pointer; position: relative; }
  .bcol:hover .bstack { filter: brightness(1.25); }
  .bstack { width: 100%; display: flex; flex-direction: column-reverse; gap: 2px; }
  .bstack i { display: block; min-height: 0; }
  .bstack i:last-child { border-radius: 4px 4px 0 0; }
  .bx { position: absolute; top: calc(100% + 5px); left: 50%; transform: translateX(-50%); font: 10px var(--mono); color: var(--subtle); }
  .cv .grid2 { margin-top: 10px; }
  /* The directory column takes what the numbers leave and cuts long paths short. */
  .cv table.costs.fill { width: 100%; }
  .cv table.costs.fill td.t { max-width: 0; width: 100%; }
  @media (max-width: 760px) {
    .costs-view .cv table.costs th, .costs-view .cv table.costs th.n { white-space: normal; }
    .costs-view .cv table.costs th, .costs-view .cv table.costs td { padding-left: 5px; padding-right: 5px; }
    .costs-view .cv table.costs td.n { font-size: 11px; }
  }
  .heat { border-collapse: separate; border-spacing: 3px; font-size: 12px; }
  .heat th { font-weight: 500; color: var(--muted); padding: 4px 8px; text-align: left; border: 0; font-size: 11.5px; }
  .heat td { border: 0; border-radius: 6px; padding: 10px 12px; min-width: 92px; font-family: var(--mono); font-size: 12px; }
  .heat td small { display: block; color: var(--text); opacity: .75; font-size: 10.5px; }
  .tag.notag { background: none; }
  .rangebar { margin-bottom: 16px; }
  .bx { white-space: nowrap; }
  .cv .sub { color: var(--subtle); font-size: 12px; margin: 0 0 12px; line-height: 1.5; }
  .heat td.nil { color: var(--subtle); background: none; }
  .trend svg { width: 100%; height: auto; display: block; }
  details.old { margin-top: 34px; border-top: 1px solid var(--line); padding-top: 14px; }
  details.old summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  #tip { position: fixed; z-index: 50; pointer-events: none; background: #0d0e12; border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; font: 11.5px/1.55 var(--mono); color: var(--text); white-space: pre; display: none; box-shadow: 0 8px 24px rgba(0,0,0,.5); }

  @media (max-width: 1100px) {
    .prow { grid-template-columns: 1fr; gap: 12px; }
    .chart { margin-right: 0; }
    .chart .med span { left: auto; right: 0; top: -30px; }
  }
  @media (max-width: 640px) {
    header { padding: 20px 16px 4px; }
    .banner { margin: 12px 16px 0; }
    .board { padding: 16px 16px 32px; }
    .sec-h { flex-wrap: wrap; } .search { width: 100%; }
    .drow { grid-template-columns: 8px 32px minmax(0, 1fr) auto 56px; }
    .drow .tag, .drow > span:nth-child(6), .drow > span:nth-child(8) { display: none; }
    .costs-view { padding: 16px 16px 32px; }
    .grid2 { grid-template-columns: 1fr; }
    footer { padding: 0 16px 24px; }
    .d-head { padding: 16px; }
    .d-body { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
    .files {
      border-right: 0; border-bottom: 1px solid var(--line); display: flex; gap: 4px;
      overflow-x: auto; padding: 8px;
    }
    .files .group { display: none; }
    .file { width: auto; white-space: nowrap; }
    .file .rn { display: inline; white-space: pre; }
    .doc { padding: 18px 16px 48px; }
  }

  /* Under a hub: the repo name opens a menu of every repo. */
  .switch { background: none; border: 1px solid transparent; border-radius: 8px; padding: 0 8px; margin: 0 -8px; font: inherit; font-weight: 600; letter-spacing: inherit; color: inherit; cursor: pointer; anchor-name: --sw; }
  .switch:hover, .switch[aria-expanded="true"] { background: var(--panel); border-color: var(--line); }
  .switch .car { color: var(--muted); font-size: 12px; margin-left: 2px; }
  #repomenu { margin: 6px 0 0; padding: 6px; min-width: min(320px, calc(100vw - 24px)); max-width: calc(100vw - 24px); max-height: min(60vh, 460px); overflow-y: auto; border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel); color: var(--text); box-shadow: 0 16px 40px rgba(0, 0, 0, .55); inset: auto; position-anchor: --sw; position-area: block-end span-inline-end; position-try-fallbacks: flip-block, flip-inline; }
  @supports not (position-area: block-end) { #repomenu { inset: 64px auto auto 16px; margin: 0; } }
  #repomenu a { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 8px 10px; border-radius: 6px; text-decoration: none; color: var(--text); font-size: 13px; min-height: 40px; }
  #repomenu a:hover { background: var(--card); }
  #repomenu a[aria-current] { background: var(--card-hover); box-shadow: inset 2px 0 0 var(--active); }
  #repomenu .rn2 { overflow-wrap: anywhere; } #repomenu .rn2 .dim { color: var(--subtle); }
  #repomenu .cnt { display: flex; gap: 10px; font: 12px var(--mono); color: var(--muted); white-space: nowrap; }
  #repomenu .cnt .run { color: var(--active); } #repomenu .cnt .att { color: var(--human); }
  #repomenu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
  #repomenu .note { padding: 8px 10px; font-size: 13px; }
  @media (pointer: coarse), (max-width: 640px) {
    .back, .switch { min-height: 44px; display: inline-flex; align-items: center; }
    .seg-btn, .more { min-height: 44px; } .drow, .file { min-height: 44px; }
    #repomenu a { min-height: 48px; }
    .seg:not(.cur) span { display: none; } .pnow { margin-top: 22px; }
  }
</style>
</head>
<body>
<header>
  <h1><a class="back" id="back" href="/" hidden>← All repos</a><span id="title">Software factory</span></h1>
  <nav class="views"><a href="#board" id="v-board">Board</a><a href="#costs" id="v-costs">Costs</a><a href="#plan" id="v-plan">Subscription</a></nav>
  <div class="status" id="status">connecting…</div>
</header>
<div id="banner"></div>
<main class="board" id="board"></main>
<main class="costs-view md" id="costsview" hidden></main>
<main class="costs-view md" id="planview" hidden></main>
<footer>
  <span>/factory run</span>
  <span>/factory run 11-14</span>
  <span>/factory &lt;anything&gt;</span>
  <span id="totals"></span>
</footer>

<div id="overlay">
  <div class="scrim" data-close></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title">
    <div class="d-head">
      <div class="num" id="d-num"></div>
      <h3 id="d-title"></h3>
      <div class="links" id="d-links"></div>
      <button class="close" data-close aria-label="Close">×</button>
    </div>
    <div class="d-body">
      <nav class="files" id="d-files"></nav>
      <article class="doc"><div class="md" id="d-doc"></div></article>
    </div>
  </aside>
</div>

<div id="repomenu" popover aria-label="Repos"></div>
<div id="tip"></div>

<script>
const POLL_MS = 2000
const LIVE = new Set(['intake', 'spec', 'build', 'gate', 'review', 'approve', 'merging'])
const STAGES = new Set([...LIVE, 'needs-info', 'needs-human', 'paused', 'merged', 'rejected'])
const SHORT = { code: 'code', ux: 'ux', ui: 'ui', security: 'sec' }

const $ = (id) => document.getElementById(id)
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])

let jobs = []
let lastRender = ''
let lastCosts = ''
let costSort = { key: 'started', dir: -1 }
const roundCache = new Map() // "<job>/<n>" -> verdicts of a finished round
let openJobId = null
let openPath = null
let openText = null

async function fetchText(url) {
  const res = await fetch(url, { cache: 'no-store' })
  if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`)
  return res.text()
}

async function fetchFirst(url) {
  try { return (await fetchText(url)).split('\n')[0].trim() } catch { return null }
}

// ---- Board ---------------------------------------------------------------

function verdictOf(line) {
  if (line === null) return 'pending'
  const m = line.match(/^(?:VERDICT|GATE):\s*(PASS|CHANGES|FAIL)$/)
  return m ? m[1] : 'invalid'
}

// A round's verdicts come from its files: the gate first, then each routed reviewer.
async function roundVerdicts(job, n) {
  const key = `${job.id}/${n}`
  if (roundCache.has(key)) return roundCache.get(key)
  const dir = `jobs/${job.id}/round-${n}/`
  const v = { gate: verdictOf(await fetchFirst(dir + 'checks.md')), reviews: {} }
  if (v.gate === 'PASS') {
    await Promise.all(Object.keys(job.agents?.reviewers || {}).map(async (r) => {
      v.reviews[r] = verdictOf(await fetchFirst(`${dir}review-${r}.md`))
    }))
  }
  const settled = v.gate === 'FAIL' || (v.gate === 'PASS' && Object.values(v.reviews).every((x) => x === 'PASS' || x === 'CHANGES'))
  if (settled && n < job.round) roundCache.set(key, v)
  return v
}

function chip(label, v, waiting, title, extra = '') {
  const cls = ['PASS', 'CHANGES', 'FAIL'].includes(v) ? v : v === 'pending' ? (waiting ? 'wait' : '') : 'bad'
  return `<span class="chip ${extra} ${cls}" title="${esc(title)}: ${esc(v)}">${esc(label)}</span>`
}

function roundRow(job, n, v) {
  const current = n === job.round
  const cells = [chip('gate', v.gate, current && job.stage === 'gate', 'gate', 'gate')]
  if (v.gate === 'PASS') {
    for (const r of Object.keys(job.agents.reviewers)) {
      cells.push(chip(SHORT[r] || r, v.reviews[r], current && job.stage === 'review', r))
    }
  }
  return `<div class="round"><span class="r">R${n}</span>${cells.join('')}</div>`
}

function elapsed(job) {
  const end = job.ended ? new Date(job.ended) : new Date()
  const min = Math.max(0, Math.floor((end - new Date(job.started)) / 60000))
  return min >= 60 ? `${Math.floor(min / 60)}h${String(min % 60).padStart(2, '0')}m` : `${min}m`
}

// The example jobs keep their issue and PR numbers but have no URLs.
const link = (url, text) =>
  url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${text}</a>` : `<span>${text}</span>`

// A local ticket (.scratch/...) has no web page: its link opens it in the drawer.
const isLocal = (job) => job.issue_url && !/^https?:/.test(job.issue_url)

function links(job) {
  const out = [isLocal(job)
    ? `<button class="tlink" data-ticket="${esc(job.id)}">ticket ${esc(job.issue)}</button>`
    : link(job.issue_url, `issue #${job.issue}`)]
  if (job.pr) out.push(link(job.pr_url, `PR #${job.pr}`))
  return out.join('')
}

function card(job, rounds) {
  const live = LIVE.has(job.stage)
  const human = job.stage === 'needs-human'
  const done = job.stage === 'merged' || job.stage === 'rejected'
  const [num, ...slug] = job.id.split('-')
  const flag = job.stage === 'paused' ? `<span class="flag">review ${esc((job.paused || {}).after || '')}</span>`
    : human ? '<span class="flag">your call</span>'
    : job.stage === 'needs-info' ? '<span class="flag wait">asked author</span>'
    : job.stage === 'rejected' ? '<span class="flag wait">rejected</span>' : ''
  const risk = job.intake?.risk
  const meta = [
    risk ? `<span class="risk-${esc(risk)}">${esc(risk)}</span>` : '',
    `<span>$${Number(job.cost_usd).toFixed(2)}</span>`,
    `<span>${elapsed(job)}</span>`,
  ].join('')
  return `
    <article class="card ${live ? 'live' : ''} ${human ? 'human' : ''} ${done ? 'done' : ''} ${job.stage}"
             data-job="${esc(job.id)}" tabindex="0">
      <div class="card-top">
        ${live ? '<span class="pulse" aria-label="running"></span>' : ''}
        <span class="num">${esc(num)} · ${esc(slug.join('-'))}</span>
        ${flag}
      </div>
      <p class="feature">${esc(job.title)}</p>
      <div class="links">${links(job)}</div>
      ${rounds.length ? `<div class="rounds">${rounds.join('')}</div>` : ''}
      <div class="meta">${meta}</div>
      ${human ? `<div class="hint">${job.pr ? `merge PR #${job.pr} to approve<br>` : ''}or give feedback: /factory &lt;anything&gt;</div>` : ''}
    </article>`
}

async function render() {
  const view = { '#costs': 'costs', '#plan': 'plan' }[location.hash] || 'board'
  $('board').hidden = view !== 'board'
  $('costsview').hidden = view !== 'costs'
  $('planview').hidden = view !== 'plan'
  for (const v of ['board', 'costs', 'plan']) $(`v-${v}`).className = v === view ? 'on' : ''
  if (view === 'costs') {
    const html = costsPage()
    if (html !== lastCosts) { lastCosts = html; $('costsview').innerHTML = html }
  } else if (view === 'plan') {
    await loadPlan()
    const html = planPage()
    if (html !== lastPlan) { lastPlan = html; $('planview').innerHTML = html }
  } else {
    const banner = jobs.filter((j) => !STAGES.has(j.stage))
      .map((j) => `<div class="banner">${esc(`Job ${j.id} has unknown stage "${j.stage}"`)}</div>`).join('')
    const html = await boardPage()
    if (html + banner !== lastRender) {
      // Keep the cursor in the search box across a re-render.
      const focus = document.activeElement?.id === 'q' ? $('q').selectionStart : null
      lastRender = html + banner
      $('board').innerHTML = html
      $('banner').innerHTML = banner
      if (focus !== null && $('q')) { $('q').focus(); $('q').setSelectionRange(focus, focus) }
    }
  }
  const running = jobs.filter((j) => LIVE.has(j.stage)).length
  const cost = jobs.reduce((sum, j) => sum + Number(j.cost_usd), 0)
  const part = (a) => jobs.reduce((sum, j) => sum + Number((j.cost_by_agent || {})[a] || 0), 0)
  $('totals').textContent = `${running} running · $${cost.toFixed(2)} API-equivalent`
    + ` (claude $${part('claude').toFixed(2)} · codex $${part('codex').toFixed(2)})`
}

let lastOk = Date.now()
let hub = null

// The tab icon grows a red badge while a job waits on a human.
function setFavicon(n) {
  const badge = n > 0 ? '<circle cx="24" cy="8" r="7.5" fill="#ff5555" stroke="#14151b" stroke-width="2"/>' : ''
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#20222c"/><path d="M6 25V15l7 4v-4l7 4V8h4v17z" fill="#8be9fd"/>${badge}</svg>`
  const href = `data:image/svg+xml,${encodeURIComponent(svg)}`
  if ($('fav').getAttribute('href') !== href) $('fav').setAttribute('href', href)
}

async function poll() {
  const status = $('status')
  try {
    jobs = await loadJobs()
    await render()
    routeJob()
    if (openJobId) await refreshDrawer()
    lastOk = Date.now()
    status.className = 'status'
    // Under a hub the status reads like the overview's: live, then the time of the last refresh.
    status.innerHTML = `<span class="dot"></span>${hub ? 'live · updated' : 'jobs/ ·'} ${new Date().toLocaleTimeString()}`
  } catch (err) {
    const quiet = Date.now() - lastOk
    status.className = hub ? 'status wait' : 'status error'
    status.innerHTML = `<span class="dot"></span>${hub ? (quiet < 60000 ? 'reconnecting…' : `stale since ${Math.round(quiet / 60000)} min`) + ' · ' : ''}${esc(err.message)}`
  }
  setFavicon(jobs.filter((j) => ATTN.has(j.stage)).length)
}

// factory/bin/job writes each jobs/<id>/job.json.
async function loadJobs() {
  let listing
  try { listing = await fetchText('jobs/') } catch { return [] }
  const doc = new DOMParser().parseFromString(listing, 'text/html')
  const ids = [...doc.querySelectorAll('a')]
    .map((a) => decodeURIComponent(a.getAttribute('href')))
    .filter((h) => h.endsWith('/'))
    .map((h) => h.slice(0, -1))
    // _features/ and other _-prefixed folders hold factory state, not jobs
    .filter((id) => !id.startsWith('_'))
    .sort()
  return Promise.all(ids.map(async (id) => JSON.parse(await fetchText(`jobs/${id}/job.json`))))
}

// ---- Drawer --------------------------------------------------------------

// python -m http.server serves an HTML index for directories; read its links.
async function listFiles(dir) {
  const doc = new DOMParser().parseFromString(await fetchText(dir), 'text/html')
  const hrefs = [...doc.querySelectorAll('a')].map((a) => decodeURIComponent(a.getAttribute('href')))
  const out = []
  for (const h of hrefs) {
    if (h.endsWith('/')) out.push(...(await listFiles(dir + h)).map((f) => h + f))
    else if (h.endsWith('.md')) out.push(h)
  }
  return out
}

const ORDER = ['issue.md', 'intake.md', 'spec.md', 'build.md', 'decision.md', 'rejection.md']
const ROUND_ORDER = ['checks', 'diff', 'review-code', 'review-security', 'review-ux', 'review-ui', 'merge-checks']

function fileRank(path) {
  if (ORDER.includes(path)) return [0, ORDER.indexOf(path), path]
  const round = path.match(/^round-(\d+)\/(.+)\.md$/)
  if (round) return [2, Number(round[1]) * 10 + ROUND_ORDER.indexOf(round[2]), path]
  return [1, 0, path] // intake-<k>.md, feedback-<k>.md
}

function sortFiles(files) {
  return files.sort((a, b) => {
    const [x, y] = [fileRank(a), fileRank(b)]
    return x[0] - y[0] || x[1] - y[1] || x[2].localeCompare(y[2])
  })
}

function tone(first) {
  if (/^(VERDICT:\s*PASS|GATE:\s*PASS|APPROVE|STATUS:\s*READY|DECISION:\s*ACCEPT|DIFF:\s*OK)$/.test(first)) return 'good'
  if (/^(VERDICT:\s*CHANGES|DECISION:\s*NEEDS-INFO|DECISION:\s*PROTECTED|STATUS:\s*PARTIAL|DIFF:\s*GROWN)$/.test(first)) return 'warn'
  if (/^(ESCALATE|REJECTED|STATUS:\s*BLOCKED|GATE:\s*FAIL|DECISION:\s*REJECT)$/.test(first)) return 'stop'
  return null
}

const firstLines = new Map()

async function refreshDrawer() {
  const job = jobs.find((j) => j.id === openJobId)
  if (!job) return
  $('d-num').textContent = `${job.id} · ${job.stage}${job.round ? ` · round ${job.round}` : ''} · $${Number(job.cost_usd).toFixed(2)} · ${elapsed(job)}`
  $('d-title').textContent = job.title
  $('d-links').innerHTML = links(job)

  const base = `jobs/${job.id}/`
  // "costs" is not a file: it renders job.cost_breakdown. Finished jobs open on it.
  const jobFiles = sortFiles(await listFiles(base))
  const files = [COSTS, ...(isLocal(job) ? [TICKET] : []), ...jobFiles]
  if (!openPath || !files.includes(openPath)) {
    openPath = DONE.has(job.stage) || !jobFiles.length ? COSTS : jobFiles[0]
  }

  let text = null
  if (openPath === COSTS) {
    text = costTable(job)
  } else if (openPath === TICKET) {
    text = await fetchText(job.issue_url).catch(() =>
      `Can't load ${job.issue_url}.\n\nStart the dashboard with \`factory/bin/dashboard\`: plain \`python3 -m http.server\` serves only factory/, not the tickets in .scratch/.`)
  } else if (openPath) {
    text = await fetchText(base + openPath)
    firstLines.set(base + openPath, text.split('\n')[0].trim())
  }
  await Promise.all(files.filter((f) => f !== COSTS && f !== TICKET && !firstLines.has(base + f)).map(async (f) => {
    firstLines.set(base + f, (await fetchText(base + f)).split('\n')[0].trim())
  }))

  let group = null
  $('d-files').innerHTML = files.map((f) => {
    const g = f.includes('/') ? f.split('/')[0].replace('round-', 'Round ') : 'Job'
    const head = g !== group ? `<div class="group">${esc(g)}</div>` : ''
    group = g
    const round = f.match(/^round-(\d+)\//)
    const name = f === COSTS ? `overview · $${Number(job.cost_usd).toFixed(2)}`
      : f === TICKET ? `ticket · ${esc(job.issue)}` : round
      ? `<span class="rn">R${round[1]} </span>${esc(f.split('/')[1].replace(/^review-|\.md$/g, ''))}`
      : esc(f)
    const t = tone(firstLines.get(base + f) || '')
    return `${head}<button class="file ${f === openPath ? 'on' : ''}" data-file="${esc(f)}">
      <span class="v ${t || ''}"></span>${name}</button>`
  }).join('') || '<div class="empty">No files yet.</div>'

  if (text !== openText) {
    openText = text
    $('d-doc').innerHTML = text === null ? '<p class="note">Intake hasn’t written anything yet.</p>'
      : openPath === COSTS ? text : markdown(text)
  }
}

const COSTS = '__costs__'
const TICKET = '__ticket__'
const DONE = new Set(['merged', 'rejected', 'needs-human', 'needs-info'])

function tokens(n) {
  n = Number(n) || 0
  return n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `${Math.round(n / 1e3)}k` : String(n)
}

function mins(ms) {
  const m = Math.round(ms / 60000)
  return m >= 60 ? `${Math.floor(m / 60)}h${String(m % 60).padStart(2, '0')}m` : `${m}m`
}

// One row per stage the job passed through, from job.history (factory/bin/job advance).
function timelineTable(job) {
  const h = job.history || []
  if (!h.length) return '<p class="note">No timeline: this job started before the factory recorded one.</p>'
  const end = job.ended ? Date.parse(job.ended) : Date.now()
  const total = end - Date.parse(h[0].at)
  const rows = h.map((e, i) => {
    const from = Date.parse(e.at)
    const to = i + 1 < h.length ? Date.parse(h[i + 1].at) : (DONE.has(e.stage) ? from : end)
    const share = total ? Math.round((100 * (to - from)) / total) : 0
    return `<tr><td>${esc(e.stage)}</td><td class="n">${e.round || '-'}</td>
      <td class="n">${esc(new Date(from).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }))}</td>
      <td class="n">${to > from ? mins(to - from) : '–'}</td>
      <td class="n"><span class="bar" style="--w:${share}%"></span>${share}%</td></tr>`
  }).join('')
  return `<table class="costs"><thead><tr><th>stage</th><th class="n">round</th><th class="n">from</th>
    <th class="n">time</th><th class="n">share</th></tr></thead><tbody>${rows}</tbody>
    <tfoot><tr><td colspan="3">total</td><td class="n">${mins(total)}</td><td></td></tr></tfoot></table>`
}

// One row per role, agent and model, from job.cost_breakdown (factory/bin/job sync).
function costTable(job) {
  const rows = job.cost_breakdown || []
  const total = rows.reduce((sum, r) => sum + Number(r.cost_usd), 0)
  const by = job.cost_by_agent || {}
  const share = (c) => (total ? Math.round((100 * c) / total) : 0)
  const body = rows.map((r) => `<tr>
      <td>${esc(r.role)}</td><td>${esc(r.agent)} · ${esc(r.model || '?')}</td>
      <td class="n">${r.sessions}</td><td class="n">${tokens(r.input_tokens)}</td>
      <td class="n">${tokens(r.cached_tokens)}</td><td class="n">${tokens(r.output_tokens)}</td>
      <td class="n">$${Number(r.cost_usd).toFixed(2)}</td>
      <td class="n"><span class="bar" style="--w:${share(r.cost_usd)}%"></span>${share(r.cost_usd)}%</td>
    </tr>`).join('')
  const followUps = (job.follow_ups || []).map((f) => `<li>${esc(f.issue)}: ${esc(f.title)}</li>`).join('')
  return `<h2>Timeline</h2>${timelineTable(job)}
    ${followUps ? `<h2>Follow-ups filed</h2><ul>${followUps}</ul>` : ''}
    <h2>Costs</h2>
    <p class="head">claude $${Number(by.claude || 0).toFixed(2)} · codex $${Number(by.codex || 0).toFixed(2)} · total $${total.toFixed(2)}</p>
    ${rows.length ? `<table class="costs">
      <thead><tr><th>role</th><th>agent · model</th><th class="n">sessions</th><th class="n">input</th>
        <th class="n">cached</th><th class="n">output</th><th class="n">cost</th><th class="n">share</th></tr></thead>
      <tbody>${body}</tbody>
      <tfoot><tr><td colspan="6">total</td><td class="n">$${total.toFixed(2)}</td><td></td></tr></tfoot>
    </table>` : '<p class="note">No priced sessions yet. The breakdown fills in as workers run.</p>'}
    <p class="note">API-equivalent at factory/config.json prices. A builder keeps one session across rounds, so its row covers every round. Input is uncached input plus cache writes.</p>`
}

// ---- Costs tables (every job, under "All tables") -------------------------

const WAIT = new Set(['needs-human', 'paused', 'needs-info'])
const money = (n) => `$${Number(n || 0).toFixed(2)}`
const pct = (part, whole) => (whole ? Math.round((100 * part) / whole) : 0)
const bar = (share) => `<span class="bar" style="--w:${share}%"></span>${share}%`
const shortModel = (m) => String(m || '?').replace(/^claude-/, '').replace(/-\d+(-\d+)*$/, '')

// Time a job spent working and waiting on a human, from job.history.
function times(job) {
  const h = job.history || []
  const end = job.ended ? Date.parse(job.ended) : Date.now()
  let wait = 0
  h.forEach((e, i) => {
    const to = i + 1 < h.length ? Date.parse(h[i + 1].at) : (TERMINAL_STAGES.has(e.stage) ? Date.parse(e.at) : end)
    if (WAIT.has(e.stage)) wait += to - Date.parse(e.at)
  })
  const total = job.started ? end - Date.parse(job.started) : 0
  return { total, wait, work: Math.max(0, total - wait) }
}
const TERMINAL_STAGES = new Set(['merged', 'rejected'])

function group(rows, keyOf) {
  const out = new Map()
  for (const r of rows) {
    const k = keyOf(r)
    const g = out.get(k) || { key: k, sessions: 0, input: 0, cached: 0, output: 0, cost: 0, jobs: new Set() }
    g.sessions += Number(r.sessions || 0); g.input += Number(r.input_tokens || 0)
    g.cached += Number(r.cached_tokens || 0); g.output += Number(r.output_tokens || 0)
    g.cost += Number(r.cost_usd || 0); g.jobs.add(r.job)
    out.set(k, g)
  }
  return [...out.values()].sort((a, b) => b.cost - a.cost)
}

function tokenTable(title, groups, total, label) {
  const body = groups.map((g) => `<tr><td>${esc(g.key)}</td><td class="n">${g.jobs.size}</td>
    <td class="n">${g.sessions}</td><td class="n">${tokens(g.input)}</td><td class="n">${tokens(g.cached)}</td>
    <td class="n">${tokens(g.output)}</td><td class="n">${money(g.cost)}</td><td class="n">${bar(pct(g.cost, total))}</td></tr>`).join('')
  return `<div><h2>${title}</h2><table class="costs"><thead><tr><th>${label}</th><th class="n">jobs</th>
    <th class="n">sessions</th><th class="n">input</th><th class="n">cached</th><th class="n">output</th>
    <th class="n">cost</th><th class="n">share</th></tr></thead><tbody>${body}</tbody></table></div>`
}

function costsTables() {
  if (!jobs.length) return '<p class="note">No jobs yet.</p>'
  const rows = jobs.flatMap((j) => (j.cost_breakdown || []).map((r) => ({ ...r, job: j.id })))
  const total = jobs.reduce((s, j) => s + Number(j.cost_usd || 0), 0)
  const agent = (a) => jobs.reduce((s, j) => s + Number((j.cost_by_agent || {})[a] || 0), 0)
  const merged = jobs.filter((j) => j.stage === 'merged')
  const t = new Map(jobs.map((j) => [j.id, times(j)]))
  const avg = (list, f) => (list.length ? list.reduce((s, j) => s + f(j), 0) / list.length : 0)
  const counts = { merged: merged.length, rejected: jobs.filter((j) => j.stage === 'rejected').length }
  counts.open = jobs.length - counts.merged - counts.rejected
  const tile = (v, k, sub = '') => `<div class="tile"><div class="v">${v}</div><div class="k">${k}</div>${sub ? `<div class="s">${sub}</div>` : ''}</div>`
  const tiles = `<div class="tiles">
    ${tile(money(total), 'total', `claude ${money(agent('claude'))} · codex ${money(agent('codex'))}`)}
    ${tile(jobs.length, 'jobs', `${counts.merged} merged · ${counts.open} open · ${counts.rejected} rejected`)}
    ${tile(money(avg(merged, (j) => Number(j.cost_usd || 0))), 'per merged job', merged.length ? `max ${money(Math.max(...merged.map((j) => Number(j.cost_usd || 0))))}` : '')}
    ${tile(avg(merged, (j) => j.round).toFixed(1), 'rounds per merged job', `${merged.filter((j) => j.round > 1).length} needed more than one`)}
    ${tile(mins(avg(merged, (j) => t.get(j.id).work)), 'working time per merged job', `waiting on you ${mins(avg(merged, (j) => t.get(j.id).wait))}`)}
    ${tile(jobs.filter((j) => j.spec_skipped).length, 'specs skipped', 'small, low-risk jobs')}
  </div>`

  const byModel = group(rows, (r) => `${r.agent} · ${shortModel(r.model)}`)
  const byRole = group(rows, (r) => String(r.role).replace(/-s\d+$/, ' (slices)'))
  const riskRows = new Map()
  for (const j of jobs) {
    const k = `${(j.intake || {}).risk || '?'} · ${(j.intake || {}).size || '?'}`
    const g = riskRows.get(k) || { key: k, n: 0, cost: 0, rounds: 0, work: 0 }
    g.n++; g.cost += Number(j.cost_usd || 0); g.rounds += j.round; g.work += t.get(j.id).work
    riskRows.set(k, g)
  }
  const riskBody = [...riskRows.values()].sort((a, b) => b.cost - a.cost).map((g) => `<tr><td>${esc(g.key)}</td>
    <td class="n">${g.n}</td><td class="n">${money(g.cost)}</td><td class="n">${money(g.cost / g.n)}</td>
    <td class="n">${(g.rounds / g.n).toFixed(1)}</td><td class="n">${mins(g.work / g.n)}</td>
    <td class="n">${bar(pct(g.cost, total))}</td></tr>`).join('')
  const days = new Map()
  for (const j of jobs) {
    const d = (j.started || '').slice(0, 10) || '?'
    days.set(d, (days.get(d) || 0) + Number(j.cost_usd || 0))
  }
  const peak = Math.max(...days.values(), 0)
  const dayBody = [...days.entries()].sort().reverse().map(([d, c]) => `<tr><td>${esc(d)}</td>
    <td class="n">${jobs.filter((j) => (j.started || '').startsWith(d)).length}</td><td class="n">${money(c)}</td>
    <td class="n"><span class="bar" style="--w:${pct(c, peak)}%"></span></td></tr>`).join('')

  const cols = [
    ['job', 'job', (j) => j.title || j.id], ['stage', 'stage', (j) => j.stage],
    ['risk', 'risk · size', (j) => `${(j.intake || {}).risk || '?'} · ${(j.intake || {}).size || '?'}`],
    ['round', 'rounds', (j) => j.round], ['work', 'working', (j) => t.get(j.id).work],
    ['wait', 'waiting', (j) => t.get(j.id).wait],
    ['claude', 'claude', (j) => Number((j.cost_by_agent || {}).claude || 0)],
    ['codex', 'codex', (j) => Number((j.cost_by_agent || {}).codex || 0)],
    ['cost', 'total', (j) => Number(j.cost_usd || 0)], ['started', 'started', (j) => j.started || ''],
  ]
  const sortCol = cols.find((c) => c[0] === costSort.key) || cols[cols.length - 1]
  const sorted = [...jobs].sort((a, b) => {
    const x = sortCol[2](a), y = sortCol[2](b)
    return (x < y ? -1 : x > y ? 1 : 0) * costSort.dir
  })
  const models = (j) => [...new Set((j.cost_breakdown || []).map((r) => shortModel(r.model)))].join(', ')
  const stageCls = (s) => s === 'merged' ? 'stage-merged' : s === 'rejected' ? 'stage-rejected' : WAIT.has(s) ? 'stage-human' : ''
  const jobBody = sorted.map((j) => {
    const tj = t.get(j.id)
    return `<tr data-job="${esc(j.id)}" tabindex="0"><td class="t" title="${esc(j.title || j.id)}">${esc(j.title || j.id)}</td>
      <td class="${stageCls(j.stage)}">${esc(j.stage)}${j.spec_skipped ? ' · no spec' : ''}</td>
      <td>${esc(cols[2][2](j))}</td><td class="n">${j.round}</td>
      <td class="n">${tj.work ? mins(tj.work) : '–'}</td><td class="n">${tj.wait ? mins(tj.wait) : '–'}</td>
      <td class="n">${money((j.cost_by_agent || {}).claude)}</td><td class="n">${money((j.cost_by_agent || {}).codex)}</td>
      <td class="n">${money(j.cost_usd)}</td>
      <td class="n">${j.started ? esc(new Date(j.started).toLocaleDateString([], { day: '2-digit', month: '2-digit' })) : '–'}</td>
      <td>${esc(models(j))}</td></tr>`
  }).join('')
  const head = cols.map(([k, label]) => `<th data-sort="${k}" class="${['job', 'stage', 'risk'].includes(k) ? '' : 'n'}${k === costSort.key ? ' on' : ''}">${label}${k === costSort.key ? (costSort.dir > 0 ? ' ↑' : ' ↓') : ''}</th>`).join('')

  return `${tiles}
    <h2>Jobs</h2>
    <table class="costs"><thead><tr>${head}<th>models</th></tr></thead><tbody>${jobBody}</tbody>
      <tfoot><tr><td colspan="6">total</td><td class="n">${money(agent('claude'))}</td><td class="n">${money(agent('codex'))}</td>
      <td class="n">${money(total)}</td><td colspan="2"></td></tr></tfoot></table>
    <div class="grid2">
      ${tokenTable('By model', byModel, total, 'agent · model')}
      ${tokenTable('By role', byRole, total, 'role')}
      <div><h2>By risk and size</h2><table class="costs"><thead><tr><th>risk · size</th><th class="n">jobs</th>
        <th class="n">cost</th><th class="n">per job</th><th class="n">rounds</th><th class="n">working</th>
        <th class="n">share</th></tr></thead><tbody>${riskBody}</tbody></table></div>
      <div><h2>By day started</h2><table class="costs"><thead><tr><th>day</th><th class="n">jobs</th>
        <th class="n">cost</th><th class="n"></th></tr></thead><tbody>${dayBody}</tbody></table></div>
    </div>
    <p class="note">API-equivalent at factory/config.json prices; on a subscription it shows relative spend, not your bill.
      Working time is the job's wall clock minus the time it waited on you (needs-human, paused, needs-info).
      Click a job to open it, a column to sort.</p>`
}

let returnFocus = null
async function openDrawer(id) {
  openJobId = id
  openPath = null
  openText = undefined
  returnFocus = document.activeElement
  document.body.classList.add('open')
  $('overlay').querySelector('.close').focus({ preventScroll: true })
  try {
    await refreshDrawer()
  } catch (err) {
    $('d-doc').innerHTML = `<p class="note">${esc(err.message)}</p>`
  }
}

function closeDrawer() {
  if (openJobId && location.hash.startsWith('#job=')) history.replaceState(null, '', '#board')
  openJobId = null
  document.body.classList.remove('open')
  if (returnFocus?.isConnected) returnFocus.focus({ preventScroll: true })
  returnFocus = null
}

document.addEventListener('click', (e) => {
  if (e.target.closest('a')) return
  const sortEl = e.target.closest('[data-sort]')
  if (sortEl) {
    const key = sortEl.dataset.sort
    costSort = { key, dir: costSort.key === key ? -costSort.dir : (['job', 'stage', 'risk'].includes(key) ? 1 : -1) }
    return render()
  }
  const ticketEl = e.target.closest('[data-ticket]')
  if (ticketEl) {
    e.stopPropagation()
    const id = ticketEl.dataset.ticket
    if (openJobId !== id) { openJobId = id; document.body.classList.add('open') }
    openPath = TICKET
    openText = undefined
    return refreshDrawer()
  }
  const cardEl = e.target.closest('[data-job]')
  if (cardEl) return openDrawer(cardEl.dataset.job)
  const fileEl = e.target.closest('[data-file]')
  if (fileEl) {
    openPath = fileEl.dataset.file
    openText = undefined
    $('d-doc').parentElement.scrollTop = 0
    return refreshDrawer()
  }
  if (e.target.closest('[data-close]')) closeDrawer()
})
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') return closeDrawer()
  const cardEl = e.target.closest?.('[data-job]')
  if (cardEl && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openDrawer(cardEl.dataset.job) }
})

// ---- Markdown (just enough for the factory's files) ---------------------

function inline(s) {
  const codes = []
  s = esc(s).replace(/`([^`]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`)
  s = s
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(((?:https?:\/\/|\.{0,2}\/|#)[^)\s]*)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`)
}

// Every step's file has a `## Summary` of a few bullets; show it first, in a box.
function splitSummary(lines) {
  const start = lines.findIndex((l) => /^##\s+Summary\s*$/.test(l))
  if (start === -1) return { lines, summary: null }
  let end = start + 1
  while (end < lines.length && !/^#{1,2}\s/.test(lines[end])) end++
  return {
    lines: [...lines.slice(0, start), ...lines.slice(end)],
    summary: lines.slice(start + 1, end).join('\n'),
  }
}

function markdown(src) {
  const split = splitSummary(src.replace(/\r/g, '').split('\n'))
  const lines = split.lines
  let i = 0
  let html = ''
  const first = (lines[0] || '').trim()
  const t = tone(first)
  if (t) {
    html += `<div class="verdict ${t}">${esc(first)}</div>`
    i = 1
    // The rest of a KEY: value header block (intake.md, checks.md).
    const extra = []
    while (i < lines.length && /^[A-Z-]+:\s/.test(lines[i])) extra.push(lines[i++])
    if (extra.length) html += `<div class="head">${esc(extra.join('\n'))}</div>`
  }
  if (split.summary !== null) html += `<section class="summary"><h2>Summary</h2>${markdown(split.summary)}</section>`

  const isList = (l) => /^\s*([-*+]|\d+\.)\s+/.test(l)
  const isBlockStart = (l) => /^(#{1,6}\s|```|\s*>|\|)/.test(l) || isList(l)

  while (i < lines.length) {
    const line = lines[i]
    if (!line.trim()) { i++; continue }

    if (line.startsWith('```')) {
      const body = []
      i++
      while (i < lines.length && !lines[i].startsWith('```')) body.push(lines[i++])
      i++
      html += `<pre><code>${esc(body.join('\n'))}</code></pre>`
      continue
    }
    const h = line.match(/^(#{1,6})\s+(.*)$/)
    if (h) { const n = Math.min(h[1].length, 4); html += `<h${n}>${inline(h[2])}</h${n}>`; i++; continue }

    if (/^\s*>/.test(line)) {
      const body = []
      while (i < lines.length && /^\s*>/.test(lines[i])) body.push(lines[i++].replace(/^\s*>\s?/, ''))
      html += `<blockquote>${markdown(body.join('\n'))}</blockquote>`
      continue
    }
    if (line.startsWith('|')) {
      const rows = []
      while (i < lines.length && lines[i].startsWith('|')) rows.push(lines[i++])
      const cells = (r) => r.replace(/^\||\|$/g, '').split('|').map((c) => inline(c.trim()))
      const body = rows.filter((r) => !/^\|[\s:|-]+\|$/.test(r))
      html += '<table>' + body.map((r, n) => `<tr>${cells(r).map((c) => n ? `<td>${c}</td>` : `<th>${c}</th>`).join('')}</tr>`).join('') + '</table>'
      continue
    }
    if (isList(line)) {
      const ordered = /^\s*\d+\./.test(line)
      const items = []
      while (i < lines.length && (isList(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
        const l = lines[i++]
        if (isList(l)) items.push({ indent: l.match(/^\s*/)[0].length, text: l.replace(/^\s*([-*+]|\d+\.)\s+/, '') })
        else items[items.length - 1].text += ' ' + l.trim()
      }
      const lis = items.map(({ indent, text }) => {
        const task = text.match(/^\[([ xX])\]\s+(.*)$/)
        const style = indent ? ` style="margin-left:${indent * 0.6}em"` : ''
        return task
          ? `<li class="task ${task[1] === ' ' ? '' : 'done'}"${style}>${inline(task[2])}</li>`
          : `<li${style}>${inline(text)}</li>`
      }).join('')
      html += ordered ? `<ol>${lis}</ol>` : `<ul>${lis}</ul>`
      continue
    }
    const para = []
    while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) para.push(lines[i++])
    html += `<p>${inline(para.join(' '))}</p>`
  }
  return html
}

// ---- Board: what needs you, what's running, then a compact history -------

const ATTN = new Set(['needs-human', 'paused', 'needs-info'])
const FINISHED = new Set(['merged', 'rejected'])
const TRACK = [['intake', 'intake'], ['spec', 'spec'], ['build', 'build'], ['gate', 'gate'], ['review', 'review'], ['approve', 'approve'], ['merging', 'merge']]
const ui = { filter: 'all', q: '', group: 'day', limit: 0, old: false, range: '30d', per: 'auto' }
for (const k of ['range', 'per']) { const v = new URLSearchParams(location.search).get(k); if (v) ui[k] = v }

const feature = (j) => (j.base && !/^(main|master)$/.test(j.base) ? j.base : null)
const numOf = (j) => j.id.split('-')[0]

function since(j) {
  const h = j.history || []
  const at = h.length ? Date.parse(h[h.length - 1].at) : Date.parse(j.started)
  return mins(Date.now() - at)
}

function who(j) {
  const b = j.agents?.builder
  if (j.stage === 'build') return b ? `${b.agent || ''} ${b.model || b}`.trim() : 'builder'
  if (j.stage === 'review') return Object.keys(j.agents?.reviewers || {}).join(' · ')
  if (j.stage === 'gate') return 'checks.sh'
  return { intake: 'intake', 'needs-info': 'author', spec: 'spec-writer', approve: 'approver', merging: 'merge' }[j.stage] || ''
}

// One dot per round, read from job.history: a round that led to another round either
// failed the gate (no review in it) or got CHANGES from a reviewer.
function roundDots(j) {
  const h = j.history || []
  const out = []
  for (let n = 1; n <= j.round; n++) {
    let cls, label
    if (n < j.round) {
      const reviewed = h.some((e) => e.round === n && e.stage === 'review')
      cls = reviewed ? 'changes' : 'fail'; label = reviewed ? 'review asked for changes' : 'gate failed'
    } else if (['merged', 'approve', 'merging'].includes(j.stage)) { cls = 'pass'; label = 'passed' }
    else if (j.stage === 'needs-human' || j.stage === 'paused') { cls = 'human'; label = 'went to you' }
    else if (j.stage === 'rejected') { cls = 'muted'; label = 'rejected' }
    else { cls = 'live'; label = 'running' }
    out.push(`<i class="rd ${cls}" data-tip="R${n}: ${label}"></i>`)
  }
  return `<span class="rdots">${out.join('')}</span>`
}

function dayKey(j) { return new Date(j.ended || j.started).toDateString() }
function dayLabel(key) {
  const d = new Date(key), today = new Date(); today.setHours(0, 0, 0, 0)
  const diff = Math.round((today - d) / 864e5)
  return diff === 0 ? 'Today' : diff === 1 ? 'Yesterday' : d.toLocaleDateString([], { weekday: 'short', day: '2-digit', month: '2-digit' })
}

function doneRow(j) {
  const f = feature(j)
  const risk = j.intake?.risk || ''
  return `<div class="drow ${esc(j.stage)}" data-job="${esc(j.id)}" tabindex="0">
    <span class="sd ${esc(j.stage)}" data-tip="${esc(j.stage)}"></span><span class="num">${esc(numOf(j))}</span>
    <span class="dt" title="${esc(j.title)}">${j.stage === 'rejected' ? '<span class="stg">rejected</span>' : ''}${esc(j.title)}</span>
    ${f ? `<span class="tag" title="${esc(f)}">${esc(f.replace(/^feature\//, ''))}</span>` : '<span class="tag notag"></span>'}
    ${roundDots(j)}<span class="risk-${esc(risk)}">${esc(risk)}</span>
    <span class="n">${money(j.cost_usd)}</span><span class="n">${elapsed(j)}</span></div>`
}

function doneSection() {
  const all = jobs.filter((j) => FINISHED.has(j.stage))
  let list = all.filter((j) => ui.filter === 'all' || j.stage === ui.filter)
  const q = ui.q.trim().toLowerCase()
  if (q) list = list.filter((j) => `${j.id} ${j.title} ${j.base || ''} #${j.issue} #${j.pr}`.toLowerCase().includes(q))
  list.sort((a, b) => String(b.ended || b.started).localeCompare(String(a.ended || a.started)))
  const limit = ui.limit || 12
  const shown = q ? list : list.slice(0, limit)
  const groups = new Map()
  for (const j of shown) {
    const k = ui.group === 'feature' ? (feature(j) || 'main') : dayKey(j)
    if (!groups.has(k)) groups.set(k, [])
    groups.get(k).push(j)
  }
  const body = [...groups].map(([k, js]) => {
    const label = ui.group === 'feature' ? k : dayLabel(k)
    const cost = js.reduce((s, j) => s + Number(j.cost_usd || 0), 0)
    return `<div class="day">${esc(label)} · ${js.length} · ${money(cost)}</div>${js.map(doneRow).join('')}`
  }).join('')
  const n = (s) => all.filter((j) => j.stage === s).length
  const btn = (key, val, label) => `<button class="seg-btn ${ui[key] === val ? 'on' : ''}" data-ui="${key}" data-val="${val}">${label}</button>`
  const tools = `<div class="tools">
      <input class="search" id="q" placeholder="search title, #, feature" value="${esc(ui.q)}">
      ${btn('filter', 'all', 'all')}${btn('filter', 'merged', `merged ${n('merged')}`)}${btn('filter', 'rejected', `rejected ${n('rejected')}`)}
      <span style="width:8px"></span>${btn('group', 'day', 'by day')}${btn('group', 'feature', 'by feature')}</div>`
  const rest = list.length - shown.length
  const more = (rest > 0 ? `<button class="more" data-ui="limit" data-val="${limit + 50}">${rest > 50 ? `show 50 more of ${rest}` : `show ${rest} more`} →</button>` : '')
    + (ui.limit ? `<button class="more" data-ui="limit" data-val="0">show fewer</button>` : '')
  return `<div class="sec-h"><h2>Done</h2><span class="count">${all.length}</span>${tools}</div>
    ${body || '<div class="calm">Nothing matches.</div>'}${more}`
}

async function currentRound(j) {
  return j.round ? [roundRow(j, j.round, await roundVerdicts(j, j.round))] : []
}

async function boardPage() {
  const attn = jobs.filter((j) => ATTN.has(j.stage))
  const live = jobs.filter((j) => LIVE.has(j.stage))
  const attnCards = await Promise.all(attn.map(async (j) => card(j, await currentRound(j))))
  const attnHtml = attn.length
    ? `<section class="b-sec attn"><div class="sec-h"><h2>Needs you</h2><span class="count">${attn.length}</span></div>
        <div class="attn-grid">${attnCards.join('')}</div></section>`
    : `<section class="b-sec attn calm-box"><span class="calm">✓ Nothing is waiting on you.</span></section>`
  const rows = await Promise.all(live.map(async (j) => {
    const cur = TRACK.findIndex(([s]) => s === j.stage)
    const slices = j.slices || []
    const sliceDone = slices.filter((x) => x.state === 'done').length
    const count = (st) => slices.filter((x) => x.state === st).length
    const sliceNote = slices.length && j.stage === 'build'
      ? ` · slices ${sliceDone}/${slices.length} done${[['running', 'running'], ['blocked', 'blocked'], ['pending', 'waiting'], ['resume', 'to resume']]
        .map(([st, word]) => (count(st) ? ` · ${count(st)} ${word}` : '')).join('')}`
      : ''
    const skipped = j.spec_skipped || (cur > 1 && (j.history || []).length && !(j.history || []).some((e) => e.stage === 'spec'))
    const segs = TRACK.map(([s, l], i) => {
      const cls = `${i < cur ? 'done' : i === cur ? 'cur' : ''} ${s === 'spec' && skipped ? 'skip' : ''}`
      if (s !== 'build' || !slices.length) return `<div class="seg ${cls}"><span>${l}</span></div>`
      const bars = slices.map((x) => `<i class="${esc(x.state)}" title="${esc(`slice ${x.n} ${x.state}: ${x.title}`)}"></i>`).join('')
      return `<div class="seg ${cls} slices">${bars}<span>${l} ${sliceDone}/${slices.length}</span></div>`
    }).join('')
    const f = feature(j)
    const risk = j.intake?.risk
    return `<article class="prow" data-job="${esc(j.id)}" tabindex="0">
      <div><div class="card-top"><span class="pulse"></span><span class="num">${esc(numOf(j))}</span>
        ${f ? `<span class="tag">${esc(f.replace(/^feature\//, ''))}</span>` : ''}</div>
        <p class="feature">${esc(j.title)}</p><div class="links">${links(j)}</div></div>
      <div><div class="segs">${segs}</div>
        <div class="pnow"><b>${esc(j.stage)}</b>${j.round ? ` · round ${j.round}` : ''}${sliceNote} · for ${since(j)} · ${esc(who(j))}</div></div>
      <div class="pside"><div class="rounds">${(await currentRound(j)).join('')}</div>
        <div class="meta">${risk ? `<span class="risk-${esc(risk)}">${esc(risk)}</span>` : ''}<span>${money(j.cost_usd)}</span><span>${elapsed(j)} total</span></div></div>
    </article>`
  }))
  const liveHtml = `<section class="b-sec"><div class="sec-h"><h2>Running</h2><span class="count">${live.length}</span></div>
    ${rows.join('') || '<div class="calm">Nothing running. Start with /factory run.</div>'}</section>`
  return attnHtml + liveHtml + `<section class="b-sec">${doneSection()}</section>`
}

// ---- Costs view ----------------------------------------------------------

let PRICES = null
fetchText('config.json').then((t) => { PRICES = JSON.parse(t).prices_usd_per_mtok || null; lastCosts = ''; render() }).catch(() => {})

// Eight roles folded to six series; colors validated for the dark card surface.
const ROLE_GROUPS = [['builder', 'builder'], ['spec-writer', 'spec'], ['intake', 'intake'], ['reviewer-code', 'code review'], ['approver', 'approver'], ['other', 'ux · ui · security']]
const ROLE_COLORS = ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#0ca30c']
function roleGroup(role) {
  const r = String(role).replace(/-s\d+$/, '')
  return ROLE_GROUPS.some(([k]) => k === r) ? r : 'other'
}
function priceOf(model) {
  if (!PRICES || !model) return null
  return PRICES[model] || PRICES[Object.keys(PRICES).find((k) => k.includes(model) || model.includes(k))] || null
}
function cacheSaving(r) {
  const p = priceOf(r.model)
  if (!p) return 0
  const read = p.cache_read ?? p.cached_input ?? p.input
  return (Number(r.cached_tokens || 0) * (p.input - read)) / 1e6
}
const median = (xs) => {
  const s = [...xs].sort((a, b) => a - b)
  return s.length ? (s.length % 2 ? s[(s.length - 1) / 2] : (s[s.length / 2 - 1] + s[s.length / 2]) / 2) : 0
}
function niceStep(x) {
  const p = 10 ** Math.floor(Math.log10(x || 1))
  return [1, 2, 2.5, 5, 10].map((m) => m * p).find((s) => s >= x) || p * 10
}
const heatBg = (v, max) => `color-mix(in srgb, #3987e5 ${Math.round(12 + 70 * (max ? v / max : 0))}%, var(--card))`

const RANGES = { '7d': 7, '30d': 30, '90d': 90, all: 0 }
const segBtn = (key, val, label) => `<button class="seg-btn ${ui[key] === val ? 'on' : ''}" data-ui="${key}" data-val="${val}">${label}</button>`

function rangeJobs() {
  const days = RANGES[ui.range]
  const cut = days ? Date.now() - days * 864e5 : 0
  return jobs.filter((j) => Date.parse(j.started || 0) >= cut)
}

function costsPage() {
  const js = rangeJobs()
  const bar = `<div class="sec-h rangebar"><span class="count">${js.length} of ${jobs.length} jobs</span><div class="tools">
    ${segBtn('range', '7d', '7 days')}${segBtn('range', '30d', '30 days')}${segBtn('range', '90d', '90 days')}${segBtn('range', 'all', 'all')}
    <span style="width:10px"></span>${segBtn('per', 'auto', 'auto')}${segBtn('per', 'job', 'per job')}${segBtn('per', 'day', 'per day')}${segBtn('per', 'week', 'per week')}</div></div>`
  return `<div class="cv">${bar}${js.length ? costsFor(js) : '<p class="note">No jobs started in this range.</p>'}
    <details class="old" ${ui.old ? 'open' : ''} data-old><summary>All tables (every job)</summary>${costsTables()}</details></div>`
}

// Same as the page above, for the jobs in the chosen range (the parameter shadows the global).
function costsFor(jobs) {
  const rows = jobs.flatMap((j) => (j.cost_breakdown || []).map((r) => ({ ...r, job: j.id })))
  const total = jobs.reduce((s, j) => s + Number(j.cost_usd || 0), 0)
  const agent = (a) => jobs.reduce((s, j) => s + Number((j.cost_by_agent || {})[a] || 0), 0)
  const merged = jobs.filter((j) => j.stage === 'merged').sort((a, b) => String(a.ended).localeCompare(String(b.ended)))
  const mc = merged.map((j) => Number(j.cost_usd || 0))
  const half = Math.floor(mc.length / 2)
  const avg = (xs) => (xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : 0)
  const trend = half ? Math.round(100 * (avg(mc.slice(half)) / avg(mc.slice(0, half)) - 1)) : 0
  const rework = jobs.filter((j) => j.round > 1)
  const reworkCost = rework.reduce((s, j) => s + Number(j.cost_usd || 0), 0)
  const saving = rows.reduce((s, r) => s + cacheSaving(r), 0)
  const inTok = rows.reduce((s, r) => s + Number(r.input_tokens || 0), 0)
  const cTok = rows.reduce((s, r) => s + Number(r.cached_tokens || 0), 0)
  const t = new Map(jobs.map((j) => [j.id, times(j)]))
  const wait = jobs.reduce((s, j) => s + t.get(j.id).wait, 0)
  const top = [...jobs].sort((a, b) => b.cost_usd - a.cost_usd)[0]
  const tile = (v, k, sub = '', extra = '') => `<div class="tile ${extra}"><div class="v">${v}</div><div class="k">${k}</div>${sub ? `<div class="s">${sub}</div>` : ''}</div>`
  const tiles = `<div class="tiles">
    ${tile(money(total), 'total', `claude ${money(agent('claude'))} · codex ${money(agent('codex'))}`)}
    ${tile(money(median(mc)), 'median per merged job', half ? `later half <span class="${trend > 0 ? 'up' : 'down'}">${trend > 0 ? '+' : ''}${trend}%</span> vs earlier` : '')}
    ${tile(`${pct(reworkCost, total)}%`, 'spent on jobs with rework', `${rework.length} of ${jobs.length} jobs needed >1 round`)}
    ${tile(PRICES ? `~${money(saving)}` : '–', 'saved by the cache', `${pct(cTok, cTok + inTok)}% of input tokens were cache reads`)}
    ${tile(mins(wait), 'waited on you', `across ${jobs.filter((j) => t.get(j.id).wait).length} jobs`)}
    <div class="tile click" data-job="${esc(top.id)}"><div class="v">${money(top.cost_usd)}</div><div class="k">most expensive job</div><div class="k2">${esc(numOf(top))} · ${esc(top.title)}</div></div>
  </div>`

  // Chart 1: stacked bars by role. One per job while that stays readable (<= 60),
  // then one per day (<= 90 days) or per week; empty days and weeks keep their slot.
  const ordered = [...jobs].sort((a, b) => String(a.started).localeCompare(String(b.started)))
  const spanDays = ordered.length ? (Date.parse(ordered[ordered.length - 1].started) - Date.parse(ordered[0].started)) / 864e5 : 0
  const per = ui.per !== 'auto' ? ui.per : ordered.length <= 60 ? 'job' : spanDays <= 90 ? 'day' : 'week'
  const startOf = (iso) => {
    const d = new Date(iso); d.setHours(0, 0, 0, 0)
    if (per === 'week') d.setDate(d.getDate() - ((d.getDay() + 6) % 7))
    return d
  }
  const buckets = new Map()
  if (per === 'job') {
    for (const j of ordered) buckets.set(j.id, { jobs: [j], label: numOf(j) })
  } else if (ordered.length) {
    const end = startOf(ordered[ordered.length - 1].started)
    for (let d = startOf(ordered[0].started); d <= end; d.setDate(d.getDate() + (per === 'week' ? 7 : 1))) {
      buckets.set(d.getTime(), { start: d.getTime(), jobs: [], label: d.toLocaleDateString([], { day: '2-digit', month: '2-digit' }) })
    }
    for (const j of ordered) buckets.get(startOf(j.started).getTime())?.jobs.push(j)
  }
  const list = [...buckets.values()].map((b) => {
    const by = new Map(ROLE_GROUPS.map(([k]) => [k, 0]))
    for (const j of b.jobs) for (const r of j.cost_breakdown || []) by.set(roleGroup(r.role), by.get(roleGroup(r.role)) + Number(r.cost_usd || 0))
    return { ...b, by, total: b.jobs.reduce((s, j) => s + Number(j.cost_usd || 0), 0) }
  })
  const maxC = Math.max(...list.map((b) => b.total), 0.01)
  const step = niceStep(maxC / 4)
  const ceil = Math.ceil(maxC / step) * step
  const grid = []
  for (let v = step; v <= ceil + 1e-9; v += step) grid.push(`<div class="gl" style="bottom:${(100 * v) / ceil}%"><span>$${v % 1 ? v.toFixed(1) : v}</span></div>`)
  const med = median(list.filter((b) => b.jobs.length).map((b) => b.total))
  const every = Math.ceil(list.length / 20)
  const unit = { job: 'job', day: 'day', week: 'week' }[per]
  const bars = list.map((b, i) => {
    const roles = ROLE_GROUPS.filter(([k]) => b.by.get(k) > 0.005).map(([k, l]) => `  ${l.padEnd(19)}${money(b.by.get(k))}`).join('\n')
    const j = b.jobs[0]
    // The newest day or week is still filling up: say so, and draw it lighter.
    const sofar = b.start !== undefined && i === list.length - 1 && Date.now() - b.start < (per === 'week' ? 7 : 1) * 864e5
    const tip = per === 'job'
      ? `${numOf(j)} · ${j.title}\n${money(j.cost_usd)} · ${j.round} round${j.round > 1 ? 's' : ''} · ${j.stage}\n${roles}`
      : `${per === 'week' ? 'week of ' : ''}${b.label}${sofar ? ' (so far)' : ''} · ${b.jobs.length} job${b.jobs.length === 1 ? '' : 's'} · ${money(b.total)}\n${roles}`
    const segs = ROLE_GROUPS.map(([k], n) => b.by.get(k) > 0 ? `<i style="flex-grow:${b.by.get(k)};background:${ROLE_COLORS[n]}"></i>` : '').join('')
    const open = b.jobs.length === 1 ? `data-job="${esc(j.id)}"` : ''
    return `<div class="bcol" ${open} data-tip="${esc(tip)}"><div class="bstack" style="height:${(100 * b.total) / ceil}%${sofar ? ';opacity:.55' : ''}">${segs}</div>${i % every ? '' : `<span class="bx">${esc(b.label)}</span>`}</div>`
  }).join('')
  const gap = list.length > 80 ? 1 : list.length > 40 ? 2 : 4
  const legend = `<div class="legend">${ROLE_GROUPS.map(([, l], i) => `<span><i style="background:${ROLE_COLORS[i]}"></i>${l}</span>`).join('')}</div>`
  const chart1 = `<h2>Cost per ${unit}</h2><p class="sub">${per === 'job'
      ? 'Each bar is one job, oldest left, split by role. Hover for the breakdown, click to open the job.'
      : `Each bar is one ${unit}, summed over the jobs started in it, split by role. Over 60 jobs the chart groups by ${unit} on its own; the buttons above override it.`}</p>
    ${legend}<div class="chart">${grid.join('')}<div class="med" style="bottom:${(100 * med) / ceil}%"><span>median\n${money(med)}/${unit}</span></div><div class="bars" style="gap:${gap}px">${bars}</div></div>
    <div style="height:26px"></div>`

  // Chart 2: merged jobs in order, with a rolling mean whose window grows with the count.
  const W = 640, H = 190, P = 30
  const jStep = niceStep(Math.max(...mc, 0.01) / 3)
  const jCeil = Math.ceil(Math.max(...mc, 0.01) / jStep) * jStep
  const win = Math.max(5, Math.round(mc.length / 15))
  const rad = mc.length > 80 ? 2.5 : mc.length > 40 ? 3.5 : 4.5
  const xs = (i) => P + (mc.length > 1 ? (i * (W - 2 * P)) / (mc.length - 1) : (W - 2 * P) / 2)
  const ys = (v) => H - P + 6 - ((H - 2 * P) * v) / jCeil
  const roll = mc.map((_, i) => avg(mc.slice(Math.max(0, i - win + 1), i + 1)))
  const path = roll.map((v, i) => `${i ? 'L' : 'M'}${xs(i).toFixed(1)},${ys(v).toFixed(1)}`).join('')
  const dots = merged.map((j, i) => `<circle cx="${xs(i)}" cy="${ys(mc[i])}" r="${rad}" fill="var(--muted)" stroke="var(--bg)" stroke-width="${rad > 3 ? 2 : 1}"
      data-job="${esc(j.id)}" data-tip="${esc(`${numOf(j)} · ${j.title}\n${money(mc[i])} · rolling mean ${money(roll[i])}`)}" style="cursor:pointer"/>`).join('')
  const step2 = jStep, ceil2 = jCeil
  const chart2 = `<div class="trend"><h2>Is it getting cheaper?</h2><p class="sub">Merged jobs in the order they finished; the line is the mean of the last ${win}.</p>
    <svg viewBox="0 0 ${W} ${H}">${[step2, step2 * 2, step2 * 3].filter((v) => v <= ceil2).map((v) => `<line x1="${P}" x2="${W - P}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)"/><text x="${P - 6}" y="${ys(v) + 4}" fill="var(--faint)" font-size="10" text-anchor="end" font-family="monospace">$${v}</text>`).join('')}<line x1="${P}" x2="${W - P}" y1="${ys(0)}" y2="${ys(0)}" stroke="var(--muted)"/>
      <path d="${path}" fill="none" stroke="#3987e5" stroke-width="2"/>${dots}
      <text x="${W - P}" y="${ys(roll[roll.length - 1] || 0) - 8}" fill="var(--text)" font-size="11" text-anchor="end" font-family="monospace">${money(roll[roll.length - 1])}</text></svg></div>`

  // Risk × size matrix.
  const RISK = ['high', 'medium', 'low'], SIZE = ['small', 'medium', 'large']
  const cell = (r, s) => jobs.filter((j) => (j.intake || {}).risk === r && (j.intake || {}).size === s)
  const maxAvg = Math.max(...RISK.flatMap((r) => SIZE.map((s) => avg(cell(r, s).map((j) => Number(j.cost_usd || 0))))))
  const matrix = `<div><h2>Risk × size</h2><p class="sub">Mean cost per job; darker is more expensive.</p><table class="heat"><tr><th></th>${SIZE.map((s) => `<th>${s}</th>`).join('')}</tr>
    ${RISK.map((r) => `<tr><th class="risk-${r}">${r}</th>${SIZE.map((s) => {
      const c = cell(r, s), a = avg(c.map((j) => Number(j.cost_usd || 0)))
      return c.length ? `<td style="background:${heatBg(a, maxAvg)}" data-tip="${esc(`${r} risk · ${s}\n${c.length} jobs · total ${money(a * c.length)}\nmean rounds ${avg(c.map((j) => j.round)).toFixed(1)}`)}">${money(a)}<small>${c.length} job${c.length > 1 ? 's' : ''}</small></td>` : '<td class="nil">–</td>'
    }).join('')}</tr>`).join('')}</table></div>`

  // Role × model heatmap.
  const models = [...new Set(rows.map((r) => `${r.agent} · ${shortModel(r.model)}`))]
  const rm = new Map()
  for (const r of rows) { const k = `${roleGroup(r.role)}|${r.agent} · ${shortModel(r.model)}`; rm.set(k, (rm.get(k) || 0) + Number(r.cost_usd || 0)) }
  const maxRm = Math.max(...rm.values(), 0)
  const roleModel = `<div><h2>Role × model</h2><p class="sub">Where the money goes, summed over all jobs.</p><table class="heat"><tr><th></th>${models.map((m) => `<th>${esc(m)}</th>`).join('')}</tr>
    ${ROLE_GROUPS.map(([k, l]) => `<tr><th>${l}</th>${models.map((m) => {
      const v = rm.get(`${k}|${m}`) || 0
      return v ? `<td style="background:${heatBg(v, maxRm)}" data-tip="${esc(`${l} on ${m}\n${money(v)} · ${pct(v, total)}% of all`)}">${money(v)}<small>${pct(v, total)}%</small></td>` : '<td class="nil">–</td>'
    }).join('')}</tr>`).join('')}</table></div>`

  // Cache per model.
  const cm = group(rows, (r) => `${r.agent} · ${shortModel(r.model)}`)
  const cacheBody = cm.map((g) => {
    const s = rows.filter((r) => `${r.agent} · ${shortModel(r.model)}` === g.key).reduce((a, r) => a + cacheSaving(r), 0)
