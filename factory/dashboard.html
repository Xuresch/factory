const ROLE_STEP = { builder: 0, 'spec-writer': 1, 'reviewer-code': 2, other: 2, intake: 3, approver: 3 }
function roleGroup(role) {
  const r = String(role).replace(/-s\d+$/, '')
  return ROLE_GROUPS.some(([k]) => k === r) ? r : 'other'
}
function priceOf(model) {
  if (!PRICES || !model) return null
  return PRICES[model] || PRICES[Object.keys(PRICES).find((k) => k.includes(model) || model.includes(k))] || null
}
function cacheSaving(r) {
  const p = priceOf(r.model)
  if (!p) return 0
  const read = p.cache_read ?? p.cached_input ?? p.input
  return (Number(r.cached_tokens || 0) * (p.input - read)) / 1e6
}
const median = (xs) => {
  const s = [...xs].sort((a, b) => a - b)
  return s.length ? (s.length % 2 ? s[(s.length - 1) / 2] : (s[s.length / 2 - 1] + s[s.length / 2]) / 2) : 0
}

// A neutral cool ramp for magnitude grids (never an agent hue); lightest is largest, text picks the readable ink.
function rampBg(v, max) {
  const f = max ? v / max : 0, a = [0x2b, 0x2e, 0x3b], b = [0xa3, 0xa8, 0xbd]
  const rgb = a.map((x, i) => Math.round(x + (b[i] - x) * (0.1 + 0.9 * f)))
  const lum = (c) => { const l = c.map((x) => { x /= 255; return x <= 0.03928 ? x / 12.92 : ((x + 0.055) / 1.055) ** 2.4 }); return 0.2126 * l[0] + 0.7152 * l[1] + 0.0722 * l[2] }
  const L = lum(rgb)
  return { bg: `rgb(${rgb})`, fg: (L + 0.05) / (0.008 + 0.05) > (0.78 + 0.05) / (L + 0.05) ? '#14151b' : '#e4e5ea' }
}

function rangeJobs() {
  const days = RANGES[ui.range]
  const cut = days ? Date.now() - days * 864e5 : 0
  return jobs.filter((j) => Date.parse(j.started || 0) >= cut)
}

function costsPage() {
  if (hub) ui.shade = 'agent'
  const js = rangeJobs()
  const extra = `<span class="gap"></span>${segBtn('per', 'auto', 'auto')}${segBtn('per', 'job', 'per job')}${segBtn('per', 'day', 'per day')}${segBtn('per', 'week', 'per week')}
    <span class="gap"></span>${segBtn('shade', 'agent', 'by agent')}${hub ? '' : segBtn('shade', 'role', 'by role')}`
  return `<div class="cv">${rangeControl(`${js.length} of ${jobs.length} jobs`, extra)}${js.length ? costsFor(js, jobs) : '<p class="note">No jobs started in this range.</p>'}
    <details class="old" ${ui.old ? 'open' : ''} data-old><summary>All tables (every job)</summary>${costsTables()}</details></div>`
}

// Buckets of jobs (one per job, day or week), each with its stacked segments, bottom-up:
// claude, codex, other; with "by role" each agent splits into role shades, darkest first.
function bucketList(js, per, byRole, from, to) {
  const startOf = (iso) => {
    const d = new Date(iso); d.setHours(0, 0, 0, 0)
    if (per === 'week') d.setDate(d.getDate() - ((d.getDay() + 6) % 7))
    return d
  }
  const ordered = [...js].sort((a, b) => String(a.started).localeCompare(String(b.started)))
  const buckets = new Map()
  if (per === 'job') {
    for (const j of ordered) buckets.set(j.id, { jobs: [j], label: `#${numOf(j)}` })
  } else if (ordered.length || from) {
    const first = from ? startOf(from) : startOf(ordered[0].started)
    const last = to ? startOf(to) : startOf(ordered[ordered.length - 1].started)
    const stepD = per === 'week' ? 7 : 1
    for (let d = new Date(first); d <= last; d.setDate(d.getDate() + stepD)) {
      buckets.set(d.getTime(), { start: d.getTime(), jobs: [], label: d.toLocaleDateString([], { month: 'short', day: 'numeric' }) })
    }
    for (const j of ordered) buckets.get(startOf(j.started).getTime())?.jobs.push(j)
  }
  return [...buckets.values()].map((b) => {
    const acc = { claude: [0, 0, 0, 0], codex: [0, 0, 0, 0], other: [0, 0, 0, 0] }
    for (const j of b.jobs) {
      const rows = j.cost_breakdown || []
      if (rows.length) for (const r of rows) acc[agentKey(r.agent)][ROLE_STEP[roleGroup(r.role)]] += Number(r.cost_usd || 0)
      else { const p = partsOf(j); for (const k of AGENT_KEYS) acc[k][1] += p[k] }
    }
    const segs = []
    for (const k of AGENT_KEYS) {
      if (!byRole || k === 'other') { const v = acc[k].reduce((a, c) => a + c, 0); if (v > 0) segs.push({ v, fill: `var(--${k})` }) }
      else acc[k].forEach((v, s) => { if (v > 0) segs.push({ v, fill: `var(--${k}-r${s + 1})` }) })
    }
    const parts = Object.fromEntries(AGENT_KEYS.map((k) => [k, acc[k].reduce((a, c) => a + c, 0)]))
    const steps = [0, 1, 2, 3].map((s) => AGENT_KEYS.reduce((a, k) => a + acc[k][s], 0))
    return { ...b, segs, parts, steps, total: partsTotal(parts) }
  })
}

const ROLE_STEP_NAMES = ['builder', 'spec', 'review', 'intake · approver']
function barItems(list, per, byRole) {
  return list.map((b, i) => {
    const j = b.jobs[0]
    // The newest day or week is still filling up: say so, and draw it lighter.
    const sofar = b.start !== undefined && i === list.length - 1 && Date.now() - b.start < (per === 'week' ? 7 : 1) * 864e5
    const roles = byRole ? `\n${b.steps.map((v, s) => (v > 0.004 ? `  ${ROLE_STEP_NAMES[s].padEnd(17)}${money(v)}` : '')).filter(Boolean).join('\n')}` : ''
    const head = per === 'job'
      ? `${numOf(j)} · ${j.title}\n${money(b.total)} · ${j.round} round${j.round > 1 ? 's' : ''} · ${j.stage}`
      : `${per === 'week' ? 'week of ' : ''}${b.label}${sofar ? ' (so far)' : ''} · ${b.jobs.length} job${b.jobs.length === 1 ? '' : 's'}\n${money(b.total)}`
    return { label: b.label, id: per === 'job' ? `#${numOf(j)}` : b.label, segs: b.segs, total: b.total, dim: sofar,
      job: per === 'job' ? j.id : b.jobs.length === 1 ? b.jobs[0].id : '', tip: `${head}\n${tipAgents(b.parts)}${roles}` }
  })
}

function agentLegend(byRole, hasOther) {
  if (!byRole) return `<div class="legend"><span>${sw('claude')}claude</span><span>${sw('codex')}codex</span>${hasOther ? `<span>${sw('other')}other</span>` : ''}</div>`
  const ramp = (k) => `<span class="ramp">${[1, 2, 3, 4].map((i) => `<i class="sw" style="background:var(--${k}-r${i})"></i>`).join('')}</span>`
  return `<div class="legend"><span>${sw('claude')}claude${ramp('claude')}</span><span>${sw('codex')}codex${ramp('codex')}</span>
    <span>shade, darkest first: ${ROLE_STEP_NAMES.join(' · ')}</span></div>`
}

// Same as the page above, for the jobs in the chosen range (the parameter shadows the global; allJobs is every job).
function costsFor(jobs, allJobs) {
  const rows = jobs.flatMap((j) => (j.cost_breakdown || []).map((r) => ({ ...r, job: j.id })))
  const total = jobs.reduce((s, j) => s + Number(j.cost_usd || 0), 0)
  const parts = addParts(jobs.map(partsOf))
  const merged = jobs.filter((j) => j.stage === 'merged').sort((a, b) => String(a.ended).localeCompare(String(b.ended)))
  const mc = merged.map((j) => Number(j.cost_usd || 0))
  const rework = jobs.filter((j) => j.round > 1)
  const reworkCost = rework.reduce((s, j) => s + Number(j.cost_usd || 0), 0)
  const saving = rows.reduce((s, r) => s + cacheSaving(r), 0)
  const inTok = rows.reduce((s, r) => s + Number(r.input_tokens || 0), 0)
  const cTok = rows.reduce((s, r) => s + Number(r.cached_tokens || 0), 0)
  const t = new Map(jobs.map((j) => [j.id, times(j)]))
  const wait = jobs.reduce((s, j) => s + t.get(j.id).wait, 0)
  const top = [...jobs].sort((a, b) => b.cost_usd - a.cost_usd)[0]

  // Cost per merged job against the previous period of the same length; "all" compares the later half with the earlier.
  const span = RANGES[ui.range]
  let delta = null, vs = ''
  if (span) {
    const now = Date.now()
    const prev = allJobs.filter((j) => j.stage === 'merged' && Date.parse(j.started || 0) >= now - 2 * span * 864e5 && Date.parse(j.started || 0) < now - span * 864e5)
    if (prev.length >= 3 && mc.length) { const p = median(prev.map((j) => Number(j.cost_usd || 0))); delta = p ? Math.round(100 * (median(mc) / p - 1)) : null; vs = `vs the previous ${span} days` }
  } else if (mc.length >= 6) {
    const half = Math.floor(mc.length / 2), e = median(mc.slice(0, half))
    delta = e ? Math.round(100 * (median(mc.slice(half)) / e - 1)) : null; vs = 'later half vs earlier half'
  }
  const tile = (v, k, sub = '', extra = '', after = '') => `<div class="tile ${extra}"><div class="v">${v}</div><div class="k">${k}</div>${sub ? `<div class="s">${sub}</div>` : ''}${after}</div>`
  const tiles = `<div class="tiles">
    ${tile(money(median(mc)), 'per merged job (median)', delta === null ? `${plural(merged.length, 'merged job')}` : `${deltaHtml(delta)} ${vs}`)}
    ${tile(money(total), 'total', `claude ${money(parts.claude)} · codex ${money(parts.codex)}`, '', splitBar(parts, 'full'))}
    ${tile(`${pct(rework.length, jobs.length)}%`, 'jobs with rework', `${pct(reworkCost, total)}% of the spend · ${rework.length} of ${jobs.length} needed >1 round`)}
    ${tile(mins(wait), 'waited on you', `across ${jobs.filter((j) => t.get(j.id).wait).length} jobs`)}
    <div class="tile click" data-job="${esc(top.id)}" tabindex="0" role="button"><div class="v">${money(top.cost_usd)}</div><div class="k">most expensive job</div><div class="k2">${esc(numOf(top))} · ${esc(top.title)}</div></div>
  </div>`

  // Chart 1: stacked by agent (role as shade on request). One bar per job while that stays readable (<= 60),
  // then one per day (<= 90 days) or per week; empty days and weeks keep their slot.
  const byRole = ui.shade === 'role'
  const ordered = [...jobs].sort((a, b) => String(a.started).localeCompare(String(b.started)))
  const spanDays = ordered.length ? (Date.parse(ordered[ordered.length - 1].started) - Date.parse(ordered[0].started)) / 864e5 : 0
  const per = ui.per !== 'auto' ? ui.per : ordered.length <= 60 ? 'job' : spanDays <= 90 ? 'day' : 'week'
  const unit = { job: 'job', day: 'day', week: 'week' }[per]
  const list = bucketList(jobs, per, byRole)
  const med = median(list.filter((b) => b.jobs.length).map((b) => b.total))
  const W = plotWidth(), H = W < 640 ? 210 : 250
  const hasOther = parts.other > 0.004
  const chart1 = `<h2>Cost per ${unit}${per === 'job' ? ', oldest left' : ''}</h2><p class="sub">${per === 'job'
      ? 'Each bar is one job, split by agent. Hover or focus for the breakdown, click to open the job.'
      : `Each bar is one ${unit}, summed over the jobs started in it, split by agent. Over 60 jobs the chart groups by ${unit} on its own; the buttons above override it.`}
      ${money(total)} in all.</p>
    ${agentLegend(byRole, hasOther)}${barChart({ W, H, items: barItems(list, per, byRole), title: `Cost per ${unit}`, desc: `${list.length} bars, ${money(total)} in total, median ${money(med)} per ${unit}.`,
      line: { v: med, label: ['median', `${money(med)}/${unit}`] } })}`

  // Chart 1b: the daily trend, always per day over the chosen range (skipped when chart 1 already is per day).
  let daily = ''
  if (per !== 'day' && jobs.length) {
    const days = span || Math.min(90, Math.max(14, Math.ceil(spanDays) + 1))
    const to = new Date(), from = new Date(to.getTime() - (days - 1) * 864e5)
    const dl = bucketList(jobs, 'day', byRole, from.toISOString(), to.toISOString())
    daily = `<h2>Cost per day</h2><p class="sub">The last ${days} days by day started, split by agent; the newest day is still filling up.</p>
      ${barChart({ W, H: 190, items: barItems(dl, 'day', byRole), title: 'Cost per day', desc: `${dl.length} days, ${money(dl.reduce((s, b) => s + b.total, 0))} in total.`, maxBar: 28 })}`
  }

  // Chart 2: merged jobs in order, with a rolling mean whose window grows with the count.
  const colW = plotWidth(2), H2 = 200
  const win = Math.max(5, Math.round(mc.length / 15))
  const avg = (xs) => (xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : 0)
  const roll = mc.map((_, i) => avg(mc.slice(Math.max(0, i - win + 1), i + 1)))
  const ax2 = niceAxis(Math.max(...mc, 0.01))
  const F2 = chartFrame({ W: colW, H: H2, ...ax2, right: 64, top: 12, title: 'Is it getting cheaper?', desc: `${mc.length} merged jobs in order of finishing, rolling mean of the last ${win}, ${mc.length ? `now ${money(roll[roll.length - 1])}` : ''}.` })
  const xs = (i) => F2.x0 + 8 + (mc.length > 1 ? (i * (F2.x1 - F2.x0 - 16)) / (mc.length - 1) : (F2.x1 - F2.x0 - 16) / 2)
  const rad = mc.length > 80 ? 2.5 : mc.length > 40 ? 3 : 4
  const path = roll.map((v, i) => `${i ? 'L' : 'M'}${xs(i).toFixed(1)},${F2.y(v).toFixed(1)}`).join('')
  const dots = merged.map((j, i) => `<circle class="pt" cx="${xs(i)}" cy="${F2.y(mc[i])}" r="${rad}" stroke-width="1.5"/>`).join('')
  const hits = merged.map((j, i) => `<circle class="hit" cx="${xs(i)}" cy="${F2.y(mc[i])}" r="${Math.max(rad + 5, 9)}" data-job="${esc(j.id)}" role="button" aria-label="${esc(`${numOf(j)}: ${money(mc[i])}`)}"
      data-tip="${esc(`${numOf(j)} · ${j.title}\n${money(mc[i])} · rolling mean ${money(roll[i])}\n${tipAgents(partsOf(j))}`)}"${mc.length <= 40 ? ' tabindex="0"' : ''}/>`).join('')
  const last = mc.length - 1
  const chart2 = !mc.length ? '<div class="trend"><h2>Is it getting cheaper?</h2><p class="sub">No merged jobs in this range yet.</p></div>' : `<div class="trend"><h2>Is it getting cheaper?</h2><p class="sub">Dots are merged jobs in the order they finished; the line is the mean of the last ${win}.</p>
    ${F2.open}${F2.grid}${dots}<path d="${path}" fill="none" stroke="var(--text)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${last >= 0 ? `<circle cx="${xs(last)}" cy="${F2.y(roll[last])}" r="5" fill="var(--text)" stroke="var(--bg)" stroke-width="2"/><text class="lab" x="${xs(last) + 11}" y="${F2.y(roll[last]) + 4}">${money(roll[last])}</text>` : ''}
    ${F2.xlabels([{ x: F2.x0 + 8, text: 'oldest' }, { x: F2.x1 - 8, text: 'latest', bold: true }])}${hits}${F2.close}</div>`

  // Risk × size matrix: a neutral ramp, the number in every cell.
  const RISK = ['high', 'medium', 'low'], SIZE = ['small', 'medium', 'large']
  const cell = (r, s) => jobs.filter((j) => (j.intake || {}).risk === r && (j.intake || {}).size === s)
  const maxAvg = Math.max(...RISK.flatMap((r) => SIZE.map((s) => avg(cell(r, s).map((j) => Number(j.cost_usd || 0))))))
  const matrix = `<div><h2>Risk × size</h2><p class="sub">Mean cost per job; lighter is more expensive.</p><table class="heat"><tr><th></th>${SIZE.map((s) => `<th>${s}</th>`).join('')}</tr>
    ${RISK.map((r) => `<tr><th class="risk-${r}">${r}</th>${SIZE.map((s) => {
      const c = cell(r, s), a = avg(c.map((j) => Number(j.cost_usd || 0)))
      const k = rampBg(a, maxAvg)
      return c.length ? `<td style="background:${k.bg};color:${k.fg}" data-tip="${esc(`${r} risk · ${s}\n${c.length} jobs · total ${money(a * c.length)}\nmean rounds ${avg(c.map((j) => j.round)).toFixed(1)}`)}">${money(a)}<small>${c.length} job${c.length > 1 ? 's' : ''}</small></td>` : '<td class="nil">–</td>'
    }).join('')}</tr>`).join('')}</table></div>`

  // Cost per role: one bar each on a common scale, claude then codex; the models are in the tooltip.
  const byRoleMap = new Map()
  for (const r of rows) {
    const g = roleGroup(r.role)
    const e = byRoleMap.get(g) || { p: { claude: 0, codex: 0, other: 0 }, models: new Map() }
    e.p[agentKey(r.agent)] += Number(r.cost_usd || 0)
    const mk = `${r.agent} · ${shortModel(r.model)}`
    e.models.set(mk, (e.models.get(mk) || 0) + Number(r.cost_usd || 0))
    byRoleMap.set(g, e)
  }
  const roleList = ROLE_GROUPS.map(([k, l]) => ({ l, e: byRoleMap.get(k) })).filter((x) => x.e).sort((a, b) => partsTotal(b.e.p) - partsTotal(a.e.p))
  const rowTotal = roleList.reduce((s, x) => s + partsTotal(x.e.p), 0)
  const maxRole = Math.max(...roleList.map((x) => partsTotal(x.e.p)), 0.01)
  const roleBars = `<div><h2>Cost per role</h2><p class="sub">Where the money goes, summed over the jobs above; one scale, claude then codex.</p>
    <div class="rbars">${roleList.map(({ l, e }) => {
      const v = partsTotal(e.p)
      const tipText = `${l} · ${money(v)}\n${tipAgents(e.p)}\n${[...e.models].map(([m, c]) => `  ${m} ${money(c)}`).join('\n')}`
      return `<div class="rb" data-tip="${esc(tipText)}"><span class="rl">${esc(l)}</span>
        <span class="rt"><span class="split wide" style="width:${Math.max(2, (100 * v) / maxRole)}%" role="img" aria-label="${esc(`${l}: ${splitText(e.p)}`)}">${AGENT_KEYS.filter((k) => e.p[k] > 0.004).map((k) => `<i style="flex:${e.p[k]} 1 0;background:var(--${k})"></i>`).join('')}</span></span>
        <span class="rv">${money(v)} · ${pct(v, rowTotal)}%</span></div>`
    }).join('')}</div></div>`

  // Cache per model; what it saved sits in this section's header.
  const swKey = (key) => sw(agentKey(String(key).split(' · ')[0]))
  const cm = group(rows, (r) => `${r.agent} · ${shortModel(r.model)}`)
  const cacheBody = cm.map((g) => {
    const s = rows.filter((r) => `${r.agent} · ${shortModel(r.model)}` === g.key).reduce((a, r) => a + cacheSaving(r), 0)
    return `<tr><td>${swKey(g.key)}${esc(g.key)}</td><td class="n">${tokens(g.input)}</td><td class="n">${tokens(g.cached)}</td><td class="n">${tokens(g.output)}</td>
      <td class="n">${pct(g.cached, g.cached + g.input)}%</td><td class="n">${money(g.cost)}</td><td class="n">${PRICES ? `~${money(s)}` : '–'}</td></tr>`
  }).join('')
  const cache = `<h2>Cache</h2><p class="cache-sav"><b>${PRICES ? `~${money(saving)}` : '–'}</b>saved by the cache · ${pct(cTok, cTok + inTok)}% of input tokens were cache reads</p>
    <p class="sub">What each model read from the cache. "~" marks an estimate: the cached tokens priced at the full input price instead of the cache-read price, from config.json.</p>
    <table class="costs"><thead><tr><th>agent · model</th><th class="n">input</th><th class="n">cached</th><th class="n">output</th><th class="n">cache share</th><th class="n">cost</th><th class="n">saved</th></tr></thead><tbody>${cacheBody}</tbody></table>`

  return `${tiles}${chart1}${daily}<div class="grid2">${chart2}${matrix}</div><div class="grid2">${roleBars}<div>${cache}</div></div>`
}

// ---- Board and costs controls, tooltips ---------------------------------

const UI_URL = { range: '30d', per: 'auto', shade: 'agent' } // kept in the query string, so a link keeps the view
function syncUrl() {
  const u = new URL(location.href)
  for (const [k, d] of Object.entries(UI_URL)) { if (ui[k] === d) u.searchParams.delete(k); else u.searchParams.set(k, ui[k]) }
  history.replaceState(history.state, '', u)
}
document.addEventListener('click', (e) => {
  const u = e.target.closest('[data-ui]')
  if (u) {
    const k = u.dataset.ui
    ui[k] = k === 'limit' ? Number(u.dataset.val) : u.dataset.val
    if (k in UI_URL) syncUrl()
    return render()
  }
  const q = e.target.closest('#rl-btn')
  if (q) {
    ui.legend = !ui.legend
    applyLegend()
  }
})
function applyLegend() {
  const b = $('rl-btn'), l = $('rlegend')
  if (!b || !l) return
  b.setAttribute('aria-expanded', String(ui.legend))
  if (ui.legend) l.removeAttribute('data-collapsed'); else l.setAttribute('data-collapsed', '')
}
document.addEventListener('toggle', (e) => { if (e.target.matches?.('[data-old]')) ui.old = e.target.open }, true)
document.addEventListener('input', (e) => { if (e.target.id === 'q') { ui.q = e.target.value; ui.limit = 0; render() } })
const tip = $('tip')
const tipHtml = (s) => esc(s).replace(/\{(claude|codex|other)\}/g, '<i class="sw $1" style="background:var(--$1)"></i>')
function showTip(el, x, y, above) {
  tip.innerHTML = tipHtml(el.dataset.tip)
  tip.style.display = 'block'
  const left = Math.max(8, Math.min(x, innerWidth - tip.offsetWidth - 8))
  const flip = above ? y - tip.offsetHeight - 8 : y + 16 + tip.offsetHeight > innerHeight ? y - tip.offsetHeight - 10 : y + 16
  tip.style.left = `${left}px`; tip.style.top = `${Math.max(8, flip)}px`
}
document.addEventListener('mousemove', (e) => {
  const el = e.target.closest?.('[data-tip]')
  if (!el) { tip.style.display = 'none'; return }
  showTip(el, e.clientX + 14, e.clientY)
})
// The same tooltip on keyboard focus.
document.addEventListener('focusin', (e) => {
  const el = e.target.closest?.('[data-tip]')
  if (el && el.matches(':focus-visible')) { const r = el.getBoundingClientRect(); showTip(el, r.left + r.width / 2, r.top, true) }
})
document.addEventListener('focusout', () => { tip.style.display = 'none' })
addEventListener('scroll', () => { tip.style.display = 'none' }, { passive: true })
let rz
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { lastCosts = ''; lastPlan = ''; render() }, 150) })

// ---- Subscription view ---------------------------------------------------
// What the factory's jobs in every repo would have cost on the API, month by month,
// against what the subscriptions cost. factory/bin/dashboard serves the data.

let lastPlan = ''
const plan = { at: 0, data: null, err: null }
const AGENTS = ['claude', 'codex']

async function loadPlan() {
  // It reads every repo's jobs; twice a minute is plenty, unless the server is still reading the sessions.
  const scanning = plan.data && plan.data.outside && plan.data.outside.status === 'scanning'
  if (Date.now() - plan.at < (scanning ? 3000 : 30000)) return
  plan.at = Date.now()
  try {
    const res = await fetch('_subscriptions.json', { cache: 'no-store' })
    plan.data = res.ok ? await res.json() : null
    plan.err = !res.ok ? (res.status === 404 ? 'old-server' : `HTTP ${res.status}: ${await res.text()}`)
      : plan.data.configured === false ? 'missing' : null
  } catch (err) { plan.data = null; plan.err = err.message }
}

// Older jobs have no cost_by_agent: all their cost was Claude's.
const agentCost = (j, a) => Number(j.cost_by_agent ? j.cost_by_agent[a] || 0 : a === 'claude' ? j.cost_usd || 0 : 0)
const monthOf = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`

// The directory an outside session ran in: "neo:/home/me/code/app/.claude/worktrees/agent-1" -> machine "neo", "…/worktrees/agent-1".
function dirLabel(cwd) {
  const m = String(cwd).match(/^([A-Za-z0-9_.-]+):(\/.*)$/)
  const segs = (m ? m[2] : String(cwd)).replace(/\/+$/, '').split('/').filter(Boolean)
  return { machine: m ? m[1] : '', short: `${segs.length > 2 ? '…/' : '/'}${segs.slice(-2).join('/')}` }
}

function planPage() {
  if (plan.err === 'old-server') {
    return `<h2>Subscription</h2><p class="note">The server behind this page doesn't serve this view yet: it was started
      before the dashboard got it, or it isn't <code>factory/bin/dashboard</code>. Stop it (Ctrl+C) and start it again:</p>
      <pre><code>factory/bin/dashboard ${esc(location.port || '8000')}</code></pre>
      <p class="note">Board and Costs work either way; reload this page after the restart.</p>`
  }
  if (plan.err === 'missing') {
    return `<h2>Subscription</h2><p class="note">Compare what the factory would have cost on the API with what you pay.
      Create <code>${esc(plan.data.config)}</code> and list your plans and every repo the factory runs in, for example:</p>
      <pre><code>${esc(JSON.stringify({ subscriptions: [{ name: 'Claude Max 5x', agent: 'claude', usd_per_month: 100 },
        { name: 'ChatGPT Pro', agent: 'codex', usd_per_month: 200 }], projects: ['~/code/app', '~/code/api'] }, null, 2))}</code></pre>`
  }
  if (plan.err) return `<p class="note">Can't load the subscription data: ${esc(plan.err)}</p>`
  if (!plan.data) return '<p class="note">Loading…</p>'
  const { subscriptions: subs, projects } = plan.data
  const outside = plan.data.outside || { status: 'off' }
  const outMonths = outside.status === 'ready' ? outside.months : {}
  const all = projects.flatMap((p) => p.jobs.map((j) => ({ ...j, project: p.name }))).filter((j) => j.started)
  const firstOut = Object.keys(outMonths).sort()[0]
  if (!all.length && !firstOut) {
    return `<p class="note">No jobs yet in the listed repos${outside.status === 'scanning' ? '; still reading the sessions outside the factory…' : '.'}</p>`
  }

  // Months from the first job or session to now; this month's fee counts pro rata.
  const now = new Date()
  const starts = all.map((j) => Date.parse(j.started))
  if (firstOut) starts.push(new Date(+firstOut.slice(0, 4), +firstOut.slice(5) - 1, 1).getTime())
  const first = new Date(Math.min(...starts))
  const allMonths = []
  for (let d = new Date(first.getFullYear(), first.getMonth(), 1); d <= now; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) {
    const end = new Date(d.getFullYear(), d.getMonth() + 1, 1)
    const share = end > now ? (now - d) / (end - d) : 1
    const key = monthOf(d)
    const jobs = all.filter((j) => monthOf(new Date(j.started)) === key)
    const monthlyFee = Object.fromEntries(AGENTS.map((a) => [a, subs.filter((s) => s.agent === a && (!s.since || s.since <= key)).reduce((t, s) => t + Number(s.usd_per_month || 0), 0)]))
    const row = { key, start: d.getTime(), end: end.getTime(), label: d.toLocaleDateString([], { month: 'short', year: 'numeric' }), short: d.toLocaleDateString([], { month: 'short' }), share, jobs: jobs.length, jl: jobs, api: {}, fac: {}, out: {}, fee: {}, monthlyFee }
    for (const a of AGENTS) {
      row.fac[a] = jobs.reduce((s, j) => s + agentCost(j, a), 0)
      row.out[a] = Number((outMonths[key] || {})[a] || 0)
      row.api[a] = row.fac[a] + row.out[a]
      row.fee[a] = share * monthlyFee[a]
    }
    row.apiT = row.api.claude + row.api.codex
    row.feeT = row.fee.claude + row.fee.codex
    row.facT = row.fac.claude + row.fac.codex
    row.outT = row.out.claude + row.out.codex
    allMonths.push(row)
  }
  // The shared time range picks the months shown; this month is always in.
  const span = RANGES[ui.range], cut = span ? Date.now() - span * 864e5 : 0
  const months = allMonths.filter((m) => m.end > cut)
  const sum = (f) => months.reduce((s, m) => s + f(m), 0)
  const api = Object.fromEntries(AGENTS.map((a) => [a, sum((m) => m.api[a])]))
  const fee = Object.fromEntries(AGENTS.map((a) => [a, sum((m) => m.fee[a])]))
  const apiT = api.claude + api.codex, feeT = fee.claude + fee.codex
  const facT = sum((m) => m.facT), outT = sum((m) => m.outT)
  const cur = months[months.length - 1]
  const prev = allMonths[allMonths.length - 2]
  const times = (x, y) => (y ? `×${(x / y).toFixed(1)}` : '–')
  const saved = (x, y) => `<span class="${x - y >= 0 ? 'sav' : ''}">${x - y >= 0 ? '' : '−'}${money(Math.abs(x - y))}</span>`

  // "On pace for": this month so far, plus the remaining days at the mean of the last 7 days for factory jobs
  // and at the month's own daily mean for the sessions outside (they are only known per month). Hidden before day 3.
  const DAY = 864e5
  const elapsed = (now - cur.start) / DAY, inMonth = (cur.end - cur.start) / DAY, left = Math.max(0, inMonth - elapsed)
  let pace = null
  if (cur.share < 1 && elapsed >= 3) {
    const win = Math.min(7, elapsed), wcut = now - win * DAY
    pace = {}
    for (const a of AGENTS) {
      const recent = cur.jl.filter((j) => Date.parse(j.started) >= wcut).reduce((s, j) => s + agentCost(j, a), 0)
      pace[a] = cur.api[a] + (recent / win + cur.out[a] / elapsed) * left
    }
    pace.T = pace.claude + pace.codex
  }
  // Only compare with a month the factory already ran in; before that the month's
  // record is partial (Claude Code deletes transcripts after 30 days).
  const paceVsPrev = pace && prev && prev.apiT && prev.facT > 0 ? Math.round(100 * (pace.T / prev.apiT - 1)) : null
  const monthFee = cur.monthlyFee.claude + cur.monthlyFee.codex

  // The hero: what was saved against what was paid.
  const outLine = outside.status === 'ready' ? `Outside the factory <b>${money(outT)}</b> (${pct(outT, apiT)}% of the API-equivalent) · factory jobs <b>${money(facT)}</b>`
    : outside.status === 'scanning' ? 'Outside the factory: reading the sessions on this machine…'
    : outside.status === 'off' ? 'Outside the factory: off in subscriptions.json' : `Outside the factory: ${esc(outside.error || outside.status)}`
  const hero = `<section class="hero" aria-label="Saved against paid">
    <div class="hk">${cur.share < 1 ? 'Saved this month so far' : 'Saved this month'}</div>
    <div class="hv">${saved(cur.apiT, cur.feeT)}<small>${times(cur.apiT, cur.feeT)} paid back</small></div>
    <div class="hs"><b>${money(cur.apiT)}</b> API-equivalent for <b>${money(cur.feeT)}</b> in fees${cur.share < 1 ? ` (${Math.round(cur.share * 100)}% of the month)` : ''}</div>
    ${pace ? `<div class="hs">On pace for <b>${money(pace.T)}</b> this month${paceVsPrev !== null ? ` · ${deltaHtml(paceVsPrev)} vs ${esc(prev.short)}` : ''}</div>`
      : prev ? `<div class="hs">${prev.short}: <b>${money(prev.apiT)}</b> API-equivalent</div>` : ''}
    <div class="hs">Since ${esc(months[0].label)}: saved ${saved(apiT, feeT)} · ${money(apiT)} for ${money(feeT)} · ${times(apiT, feeT)}</div>
    <div class="hs">${outLine}</div></section>`

  // A bullet graph per provider for this month: API-equivalent as the bar (factory solid, outside tinted and outlined),
  // the fee as a marker, bands at 1x and 3x the fee.
  const bullet = (a) => {
    const v = cur.api[a], f = cur.fee[a]
    const { max } = niceAxis(Math.max(v, f * 3.2, 1) / 1.08)
    const x = (n) => `${Math.min(100, (100 * n) / max)}%`
    const mid = max / 2
    const aria = `${a}: ${money(v)} API-equivalent this month${cur.share < 1 ? ' so far' : ''}, ${f ? `fee ${money(f)}, ${times(v, f)}` : 'no subscription listed'}; factory ${money(cur.fac[a])}, outside ${money(cur.out[a])}`
    return `<div class="bl" role="img" aria-label="${esc(aria)}" data-tip="${esc(`${a}\n${money(v)} API-equivalent · factory ${money(cur.fac[a])} · outside ${money(cur.out[a])}\n${f ? `fee ${money(f)} · ${times(v, f)}` : 'no subscription listed'}`)}">
      <div class="bl-head"><span class="nm">${sw(a)}${a}<b>${f ? times(v, f) : '–'}</b></span><span class="gl2">${money(v)}${f ? ` for ${money(f)}` : ' · no subscription listed'}</span></div>
      <div class="bl-track" style="--b1:${x(f)};--b2:${x(f * 3)}"><div class="bl-bar" style="width:${x(v)}">
        ${cur.fac[a] > 0 ? `<i style="flex:${cur.fac[a]} 1 0;background:var(--${a})"></i>` : ''}${cur.out[a] > 0 ? `<i class="out" style="flex:${cur.out[a]} 1 0;background:var(--${a}-soft);box-shadow:inset 0 0 0 1.5px var(--${a})"></i>` : ''}</div>
        ${f ? `<span class="bl-fee" style="left:calc(${x(f)} - 1px)" title="fee"></span>` : ''}</div>
      <div class="bl-axis"><span style="left:0">$0</span><span style="left:50%">${axisFmt(mid)}</span><span style="left:100%">${axisFmt(max)}</span></div>
      <div class="bl-sub">${f ? `fee marker ${money(f)} · ` : ''}factory ${money(cur.fac[a])} · outside ${money(cur.out[a])}</div></div>`
  }
  const bullets = `<section class="bullets" aria-label="Value per provider"><h3>${esc(cur.label)}${cur.share < 1 ? ' so far' : ''}, by provider</h3>
    ${AGENTS.map(bullet).join('')}
    <div class="legend"><span>${sw('claude')}${sw('codex')}in factory jobs</span><span>${sw('claude', 'out')}${sw('codex', 'out')}outside the factory</span><span><i class="sw fee" style="border-top-style:solid"></i>fee (bands: under 1x, 1x to 3x, over 3x)</span></div></section>`

  // One column per month, split by agent; the factory part solid, the part outside tinted with a stroke in the agent colour.
  // The fee is a dashed line across the month's column: above it is money saved. This month gets a hatched "on pace" cap.
  const n = months.length
  const avail = plotWidth()
  let right = 100, W = Math.min(avail, 48 + n * 190 + right)
  let slot = (W - 48 - right) / n
  const labelEach = slot >= 170
  if (!labelEach) { right = avail <= 640 ? 76 : 100; W = Math.min(avail, Math.max(360, 48 + n * 130 + right)); slot = (W - 48 - right) / n }
  const items = months.map((m, i) => {
    const isCur = m === cur
    const segs = []
    for (const a of AGENTS) {
      if (m.fac[a] > 0) segs.push({ v: m.fac[a], fill: `var(--${a})` })
      if (m.out[a] > 0) segs.push({ v: m.out[a], fill: `var(--${a}-soft)`, stroke: `var(--${a})` })
    }
    const ghost = isCur && pace && pace.T > m.apiT ? pace.T : 0
    const tip = `${m.label}${m.share < 1 ? ' (so far)' : ''} · ${plural(m.jobs, 'factory job')}\n${money(m.apiT)} API-equivalent\n`
      + AGENTS.map((a) => `{${a}} ${a.padEnd(7)}${money(m.api[a]).padStart(9)}  factory ${money(m.fac[a])} · outside ${money(m.out[a])} · fee ${money(m.fee[a])}`).join('\n')
      + `\n${m.apiT >= m.feeT ? 'saved' : 'short by'} ${money(Math.abs(m.apiT - m.feeT))} · ${times(m.apiT, m.feeT)}`
      + (ghost ? `\non pace for ${money(pace.T)} (claude ${money(pace.claude)} · codex ${money(pace.codex)})` : '')
    const showNote = labelEach || isCur
    const mark = m.feeT > 0 ? { v: m.feeT, label: labelEach || isCur ? ['break-even', money(m.feeT)] : null } : null
    return { label: m.short + (new Date(m.start).getFullYear() !== now.getFullYear() ? ` ${new Date(m.start).getFullYear()}` : ''), segs, total: m.apiT, ghost, tip, mark,
      note: showNote && m.apiT > m.feeT ? `saved ${money(m.apiT - m.feeT)}` : '', noteCls: 'sav' }
  })
  const chartSvg = barChart({ W, H: 270, items, title: 'Per month, API-equivalent against fees', maxBar: 64, right,
    desc: `${n} months. ${months.map((m) => `${m.label}: ${money(m.apiT)} API-equivalent against ${money(m.feeT)} in fees`).join('; ')}.` })
  const legend = `<div class="legend"><span>${sw('claude')}claude in factory jobs</span><span>${sw('claude', 'out')}claude outside the factory</span>
    <span>${sw('codex')}codex in factory jobs</span><span>${sw('codex', 'out')}codex outside the factory</span>
    <span><i class="sw fee"></i>subscription fees: the break-even</span>${pace ? '<span><i class="sw hatch"></i>on pace for this month</span>' : ''}</div>`
  const aside = `<aside><p><b>Above the dashed line is money saved.</b> Each column is what that month's work would have cost on the API: the factory's jobs, plus every other Claude Code and Codex session on this machine.</p>
    <p>${subsLine(subs)}</p></aside>`
  const chart = `<h2>Per month</h2><p class="sub">API-equivalent per month against the subscription fee that month.</p>${legend}
    <div class="chart-row"><div>${chartSvg}</div>${avail - W >= 260 ? aside : ''}</div>`

  const monthRows = [...months].reverse().map((m) => `<tr><td>${esc(m.label)}${m.share < 1 ? ' <span class="note">so far</span>' : ''}</td>
    <td class="n">${m.jobs}</td><td class="n">${money(m.facT)}</td><td class="n">${money(m.outT)}</td>
    ${AGENTS.map((a) => `<td class="n">${money(m.api[a])}</td><td class="n">${money(m.fee[a])}</td>`).join('')}
    <td class="n">${saved(m.apiT, m.feeT)}</td><td class="n">${times(m.apiT, m.feeT)}</td></tr>`).join('')
  const monthTable = `<h2>Months</h2><table class="costs"><thead><tr><th>month</th><th class="n">jobs</th>
    <th class="n">factory</th><th class="n">outside</th>
    <th class="n">claude API</th><th class="n">claude fee</th><th class="n">codex API</th><th class="n">codex fee</th>
    <th class="n">saved</th><th class="n">value</th></tr></thead><tbody>${monthRows}</tbody>
    <tfoot><tr><td>total</td><td class="n">${sum((m) => m.jobs)}</td><td class="n">${money(facT)}</td><td class="n">${money(outT)}</td>${AGENTS.map((a) => `<td class="n">${money(api[a])}</td><td class="n">${money(fee[a])}</td>`).join('')}
    <td class="n">${saved(apiT, feeT)}</td><td class="n">${times(apiT, feeT)}</td></tr></tfoot></table>`

  const projRows = projects.map((p) => {
    const c = p.jobs.reduce((s, j) => s + agentCost(j, 'claude'), 0), x = p.jobs.reduce((s, j) => s + agentCost(j, 'codex'), 0)
    return { p, c, x, t: c + x }
  }).sort((a, b) => b.t - a.t)
  const projTotal = projRows.reduce((s, r) => s + r.t, 0)
  const projBody = projRows.map(({ p, c, x, t }) => `<tr><td>${esc(p.name)}${p.missing ? ' <span class="note">not found</span>' : ''}</td>
    <td class="n">${p.jobs.length}</td><td class="n">${money(c)}</td><td class="n">${money(x)}</td><td class="n">${money(t)}</td>
    <td class="n"><span class="bar" style="--w:${pct(t, projRows[0]?.t || 1)}%"></span>${pct(t, projTotal)}%</td></tr>`).join('')
  const projTable = `<h2>Repos</h2><table class="costs"><thead><tr><th>repo</th><th class="n">jobs</th><th class="n">claude</th>
    <th class="n">codex</th><th class="n">API-equivalent</th><th class="n">share</th></tr></thead><tbody>${projBody}</tbody></table>`

  // Where the work outside the factory happened: the session's directory (last two segments; the full path is the tooltip).
  const dirs = outside.by_cwd || []
  const showAll = ui.dirs === 'all'
  const dirTotal = dirs.reduce((s, c) => s + c.claude + c.codex, 0) || outT
  const maxDir = Math.max(...dirs.map((c) => c.claude + c.codex), 0.01)
  const shownDirs = dirs.slice(0, showAll ? 15 : 8)
  const outRows = shownDirs.map((c) => {
    const d = dirLabel(c.cwd), t = c.claude + c.codex
    return `<tr><td class="t" title="${esc(c.cwd)}">${d.machine ? `<span class="mach">${esc(d.machine)}</span>` : ''}${esc(d.short)}</td>
      <td class="n">${c.sessions}</td><td class="n">${money(c.claude)}</td><td class="n">${money(c.codex)}</td>
      <td class="n"><span class="bar" style="--w:${(100 * t) / maxDir}%"></span>${pct(t, dirTotal)}%</td></tr>`
  }).join('')
  const rest = Math.min(dirs.length, 15) - shownDirs.length
  const restRow = rest > 0 ? `<tr><td colspan="5"><button class="more" data-ui="dirs" data-val="all">${rest} more directories ${money(dirs.slice(8, 15).reduce((s, c) => s + c.claude + c.codex, 0))} →</button></td></tr>`
    : showAll && dirs.length > 8 ? '<tr><td colspan="5"><button class="more" data-ui="dirs" data-val="top">show fewer</button></td></tr>' : ''
  const outTable = outRows ? `<h2>Outside the factory</h2><p class="sub">Claude and Codex sessions not part of a job, by
    directory; the top ${shownDirs.length} of ${dirs.length}. The bar is relative to the biggest directory, the percentage to all of them.</p><table class="costs fill"><thead><tr><th>directory</th>
    <th class="n">sessions</th><th class="n">claude</th><th class="n">codex</th><th class="n">share</th></tr></thead>
    <tbody>${outRows}${restRow}</tbody></table>` : ''
  const shown = new Set(months.map((m) => m.key))
  const unpriced = {}
  for (const [m, models] of Object.entries(outside.unpriced || {})) {
    if (shown.has(m)) for (const [model, c] of Object.entries(models)) unpriced[model] = (unpriced[model] || 0) + c
  }
  const unpricedNote = Object.keys(unpriced).length ? ` Not counted, no price in config.json prices_usd_per_mtok:
    ${Object.entries(unpriced).map(([model, c]) => `${esc(model)} (${tokens(c)} tokens)`).join(', ')}.` : ''

  return `<div class="cv">${rangeControl(`${plural(n, 'month')} of ${allMonths.length}`)}<div class="plan-top">${hero}${bullets}</div>${chart}${monthTable}${projTable}${outTable}
    <p class="note">Subscriptions: ${subsLine(subs)}, from <code>${esc(plan.data.config)}</code>. API-equivalent at each repo's
      factory/config.json prices. Outside the factory: every other Claude Code transcript and Codex session on this
      machine, at this repo's prices; orchestrating sessions count there too. Claude Code deletes transcripts after
      30 days unless <code>cleanupPeriodDays</code> says otherwise, so older months lack that part.${unpricedNote}
      This month's fees count pro rata. "On pace" adds the rest of the month at the mean of the last seven days (factory jobs)
      and at the month's daily mean (outside sessions); it is a projection, not a forecast, and shows from day 3.
      Monthly fee now: ${money(monthFee)}.</p></div>`
}
const subsLine = (subs) => subs.map((s) => `${esc(s.name || s.agent)} ${money(s.usd_per_month)}/month${s.since ? ` since ${esc(s.since)}` : ''}`).join(' · ') || 'none listed'

// #job=<id> opens that job's drawer (the hub's overview deep-links here). Needs the jobs loaded.
function routeJob() {
  const m = location.hash.match(/^#job=(.+)$/)
  if (!m) return
  const id = decodeURIComponent(m[1])
  if (openJobId !== id && jobs.some((j) => j.id === id)) openDrawer(id)
}

// Under the hub, `hub` answers {repo, overview}; run locally it 404s and nothing changes. Then the hub's
// app bar (hub/static/nav.js) replaces this page's header, view tabs, repo switcher, search and status.
const hubReady = fetch('hub', { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).then((h) => {
  const root = document.documentElement
  if (!h || !h.overview) { root.classList.remove('hub'); return }
  hub = h
  root.classList.add('hub')
  const bar = document.createElement('script')
  bar.src = new URL('static/nav.js', new URL(h.overview, location.href)).href
  bar.onload = () => { if (!window.FactoryNav?.fail) { lastRender = ''; lastCosts = ''; render() } }
  bar.onerror = () => {}
  document.head.append(bar)
}).catch(() => { document.documentElement.classList.remove('hub') })

window.addEventListener('hashchange', () => { render(); routeJob() })
hubReady.then(() => { poll(); setInterval(poll, POLL_MS) })
</script>
</body>
</html>
