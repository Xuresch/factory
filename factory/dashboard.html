    return `<tr><td>${esc(g.key)}</td><td class="n">${tokens(g.input)}</td><td class="n">${tokens(g.cached)}</td><td class="n">${tokens(g.output)}</td>
      <td class="n">${bar(pct(g.cached, g.cached + g.input))}</td><td class="n">${money(g.cost)}</td><td class="n">${PRICES ? `~${money(s)}` : '–'}</td></tr>`
  }).join('')
  const cache = `<h2>Cache</h2><p class="sub">What each model read from the cache, and roughly what it would have cost at the full input price.</p>
    <table class="costs"><thead><tr><th>agent · model</th><th class="n">input</th><th class="n">cached</th><th class="n">output</th><th class="n">cache share</th><th class="n">cost</th><th class="n">saved</th></tr></thead><tbody>${cacheBody}</tbody></table>`

  return `${tiles}${chart1}<div class="grid2">${chart2}${matrix}</div><div class="grid2">${roleModel}<div>${cache}</div></div>`
}

// ---- Subscription view ---------------------------------------------------
// What the factory's jobs in every repo would have cost on the API, month by month,
// against what the subscriptions cost. factory/bin/dashboard serves the data.

let lastPlan = ''
const plan = { at: 0, data: null, err: null }
const AGENTS = [['claude', '#3987e5'], ['codex', '#d95926']]

async function loadPlan() {
  // It reads every repo's jobs; twice a minute is plenty, unless the server is still reading the sessions.
  const scanning = plan.data && plan.data.outside && plan.data.outside.status === 'scanning'
  if (Date.now() - plan.at < (scanning ? 3000 : 30000)) return
  plan.at = Date.now()
  try {
    const res = await fetch('_subscriptions.json', { cache: 'no-store' })
    plan.data = res.ok ? await res.json() : null
    plan.err = !res.ok ? (res.status === 404 ? 'old-server' : `HTTP ${res.status}: ${await res.text()}`)
      : plan.data.configured === false ? 'missing' : null
  } catch (err) { plan.data = null; plan.err = err.message }
}

// Older jobs have no cost_by_agent: all their cost was Claude's.
const agentCost = (j, a) => Number(j.cost_by_agent ? j.cost_by_agent[a] || 0 : a === 'claude' ? j.cost_usd || 0 : 0)
const monthOf = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`

function planPage() {
  if (plan.err === 'old-server') {
    return `<h2>Subscription</h2><p class="note">The server behind this page doesn't serve this view yet: it was started
      before the dashboard got it, or it isn't <code>factory/bin/dashboard</code>. Stop it (Ctrl+C) and start it again:</p>
      <pre><code>factory/bin/dashboard ${esc(location.port || '8000')}</code></pre>
      <p class="note">Board and Costs work either way; reload this page after the restart.</p>`
  }
  if (plan.err === 'missing') {
    return `<h2>Subscription</h2><p class="note">Compare what the factory would have cost on the API with what you pay.
      Create <code>${esc(plan.data.config)}</code> and list your plans and every repo the factory runs in, for example:</p>
      <pre><code>${esc(JSON.stringify({ subscriptions: [{ name: 'Claude Max 5x', agent: 'claude', usd_per_month: 100 },
        { name: 'ChatGPT Pro', agent: 'codex', usd_per_month: 200 }], projects: ['~/code/app', '~/code/api'] }, null, 2))}</code></pre>`
  }
  if (plan.err) return `<p class="note">Can't load the subscription data: ${esc(plan.err)}</p>`
  if (!plan.data) return '<p class="note">Loading…</p>'
  const { subscriptions: subs, projects } = plan.data
  const outside = plan.data.outside || { status: 'off' }
  const outMonths = outside.status === 'ready' ? outside.months : {}
  const all = projects.flatMap((p) => p.jobs.map((j) => ({ ...j, project: p.name }))).filter((j) => j.started)
  const firstOut = Object.keys(outMonths).sort()[0]
  if (!all.length && !firstOut) {
    return `<p class="note">No jobs yet in the listed repos${outside.status === 'scanning' ? '; still reading the sessions outside the factory…' : '.'}</p>`
  }

  // Months from the first job or session to now; this month's fee counts pro rata.
  const now = new Date()
  const starts = all.map((j) => Date.parse(j.started))
  if (firstOut) starts.push(new Date(+firstOut.slice(0, 4), +firstOut.slice(5) - 1, 1).getTime())
  const first = new Date(Math.min(...starts))
  const months = []
  for (let d = new Date(first.getFullYear(), first.getMonth(), 1); d <= now; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) {
    const end = new Date(d.getFullYear(), d.getMonth() + 1, 1)
    const share = end > now ? (now - d) / (end - d) : 1
    const key = monthOf(d)
    const jobs = all.filter((j) => monthOf(new Date(j.started)) === key)
    const row = { key, label: d.toLocaleDateString([], { month: 'short', year: 'numeric' }), share, jobs: jobs.length, api: {}, fac: {}, out: {}, fee: {} }
    for (const [a] of AGENTS) {
      row.fac[a] = jobs.reduce((s, j) => s + agentCost(j, a), 0)
      row.out[a] = Number((outMonths[key] || {})[a] || 0)
      row.api[a] = row.fac[a] + row.out[a]
      row.fee[a] = share * subs.filter((s) => s.agent === a && (!s.since || s.since <= key))
        .reduce((t, s) => t + Number(s.usd_per_month || 0), 0)
    }
    row.apiT = row.api.claude + row.api.codex
    row.feeT = row.fee.claude + row.fee.codex
    row.facT = row.fac.claude + row.fac.codex
    row.outT = row.out.claude + row.out.codex
    months.push(row)
  }
  const sum = (f) => months.reduce((s, m) => s + f(m), 0)
  const api = Object.fromEntries(AGENTS.map(([a]) => [a, sum((m) => m.api[a])]))
  const fee = Object.fromEntries(AGENTS.map(([a]) => [a, sum((m) => m.fee[a])]))
  const apiT = api.claude + api.codex, feeT = fee.claude + fee.codex
  const facT = sum((m) => m.facT), outT = sum((m) => m.outT)
  const cur = months[months.length - 1]
  const times = (x, y) => (y ? `×${(x / y).toFixed(1)}` : '–')
  const saved = (x, y) => `<span class="${x - y >= 0 ? 'down' : 'up'}">${x - y >= 0 ? '' : '−'}${money(Math.abs(x - y))}</span>`
  const tile = (v, k, sub) => `<div class="tile"><div class="v">${v}</div><div class="k">${k}</div><div class="s">${sub}</div></div>`
  const tiles = `<div class="tiles">
    ${tile(saved(apiT, feeT), `saved since ${esc(months[0].label)}`, `${money(apiT)} API-equivalent for ${money(feeT)} in fees · ${times(apiT, feeT)}`)}
    ${tile(saved(cur.apiT, cur.feeT), 'this month so far', `${money(cur.apiT)} for ${money(cur.feeT)} (${Math.round(cur.share * 100)}% of the month) · ${times(cur.apiT, cur.feeT)}`)}
    ${AGENTS.map(([a]) => tile(times(api[a], fee[a]), `${a}: value per dollar paid`, `${money(api[a])} for ${money(fee[a])}${fee[a] ? '' : ' · no subscription listed'}`)).join('')}
    ${outside.status === 'ready' ? tile(money(outT), 'outside the factory', `${pct(outT, apiT)}% of the API-equivalent · factory jobs ${money(facT)}`)
      : tile('…', 'outside the factory', outside.status === 'scanning' ? 'reading the sessions on this machine' : outside.status === 'off' ? 'off in subscriptions.json' : esc(outside.error || outside.status))}
  </div>`

  // One bar per month, split by agent, with the month's fee as a line across it.
  const ceilV = Math.max(...months.map((m) => Math.max(m.apiT, m.feeT)), 1)
  const step = niceStep(ceilV / 4), top = Math.ceil(ceilV / step) * step
  const grid = []
  for (let v = step; v <= top + 1e-9; v += step) grid.push(`<div class="gl" style="bottom:${(100 * v) / top}%"><span>$${v}</span></div>`)
  const bars = months.map((m) => {
    const tip = `${m.label}${m.share < 1 ? ' (so far)' : ''} · ${m.jobs} jobs\n`
      + AGENTS.map(([a]) => `  ${a.padEnd(8)}${money(m.api[a]).padStart(9)} API (factory ${money(m.fac[a])}, outside ${money(m.out[a])}) · ${money(m.fee[a])} fee`).join('\n')
      + `\n  saved   ${(m.apiT >= m.feeT ? '' : '−') + money(Math.abs(m.apiT - m.feeT))}`
    // Per agent: the factory's part solid, the part outside it faded.
    const segs = AGENTS.map(([a, c]) => (m.fac[a] > 0 ? `<i style="flex-grow:${m.fac[a]};background:${c}"></i>` : '')
      + (m.out[a] > 0 ? `<i style="flex-grow:${m.out[a]};background:${c};opacity:.45"></i>` : '')).join('')
    return `<div class="bcol" data-tip="${esc(tip)}" style="max-width:120px">
      <div class="bstack" style="height:${(100 * m.apiT) / top}%${m.share < 1 ? ';opacity:.6' : ''}">${segs}</div>
      <div class="fee" style="bottom:${(100 * m.feeT) / top}%"></div><span class="bx">${esc(m.label)}</span></div>`
  }).join('')
  const legend = `<div class="legend">${AGENTS.map(([a, c]) => `<span><i style="background:${c}"></i>${a} in factory jobs</span>
    <span><i style="background:${c};opacity:.45"></i>${a} outside the factory</span>`).join('')}
    <span><i class="fee-key"></i>subscription fees</span></div>`
  const chart = `<h2>Per month</h2><p class="sub">Bars: what the month's work would have cost on the API, factory jobs and everything else. Line: what the subscriptions cost that month. Above the line is money saved.</p>
    ${legend}<div class="chart">${grid.join('')}<div class="bars" style="justify-content:center">${bars}</div></div><div style="height:26px"></div>`

  const monthRows = [...months].reverse().map((m) => `<tr><td>${esc(m.label)}${m.share < 1 ? ' <span class="note">so far</span>' : ''}</td>
    <td class="n">${m.jobs}</td><td class="n">${money(m.facT)}</td><td class="n">${money(m.outT)}</td>
    ${AGENTS.map(([a]) => `<td class="n">${money(m.api[a])}</td><td class="n">${money(m.fee[a])}</td>`).join('')}
    <td class="n">${saved(m.apiT, m.feeT)}</td><td class="n">${times(m.apiT, m.feeT)}</td></tr>`).join('')
  const monthTable = `<h2>Months</h2><table class="costs"><thead><tr><th>month</th><th class="n">jobs</th>
    <th class="n">factory</th><th class="n">outside</th>
    <th class="n">claude API</th><th class="n">claude fee</th><th class="n">codex API</th><th class="n">codex fee</th>
    <th class="n">saved</th><th class="n">value</th></tr></thead><tbody>${monthRows}</tbody>
    <tfoot><tr><td>total</td><td class="n">${all.length}</td><td class="n">${money(facT)}</td><td class="n">${money(outT)}</td>${AGENTS.map(([a]) => `<td class="n">${money(api[a])}</td><td class="n">${money(fee[a])}</td>`).join('')}
    <td class="n">${saved(apiT, feeT)}</td><td class="n">${times(apiT, feeT)}</td></tr></tfoot></table>`

  const projRows = projects.map((p) => {
    const c = p.jobs.reduce((s, j) => s + agentCost(j, 'claude'), 0), x = p.jobs.reduce((s, j) => s + agentCost(j, 'codex'), 0)
    return { p, c, x, t: c + x }
  }).sort((a, b) => b.t - a.t).map(({ p, c, x, t }) => `<tr><td>${esc(p.name)}${p.missing ? ' <span class="note">not found</span>' : ''}</td>
    <td class="n">${p.jobs.length}</td><td class="n">${money(c)}</td><td class="n">${money(x)}</td><td class="n">${money(t)}</td>
    <td class="n">${bar(pct(t, apiT))}</td></tr>`).join('')
  const projTable = `<h2>Repos</h2><table class="costs"><thead><tr><th>repo</th><th class="n">jobs</th><th class="n">claude</th>
    <th class="n">codex</th><th class="n">API-equivalent</th><th class="n">share</th></tr></thead><tbody>${projRows}</tbody></table>`

  // Where the work outside the factory happened: the session's directory.
  const home = (c) => c.replace(/^\/home\/[^/]+|^\/Users\/[^/]+/, '~')
  const outRows = (outside.by_cwd || []).slice(0, 15).map((c) => `<tr><td class="t" title="${esc(c.cwd)}">${esc(home(c.cwd))}</td>
    <td class="n">${c.sessions}</td><td class="n">${money(c.claude)}</td><td class="n">${money(c.codex)}</td>
    <td class="n">${bar(pct(c.claude + c.codex, outT))}</td></tr>`).join('')
  const outTable = outRows ? `<h2>Outside the factory</h2><p class="sub">Claude and Codex sessions not part of a job, by
    directory; the top 15 of ${(outside.by_cwd || []).length}.</p><table class="costs fill"><thead><tr><th>directory</th>
    <th class="n">sessions</th><th class="n">claude</th><th class="n">codex</th><th class="n">share</th></tr></thead>
    <tbody>${outRows}</tbody></table>` : ''
  const shown = new Set(months.map((m) => m.key))
  const unpriced = {}
  for (const [m, models] of Object.entries(outside.unpriced || {})) {
    if (shown.has(m)) for (const [model, n] of Object.entries(models)) unpriced[model] = (unpriced[model] || 0) + n
  }
  const unpricedNote = Object.keys(unpriced).length ? ` Not counted, no price in config.json prices_usd_per_mtok:
    ${Object.entries(unpriced).map(([model, n]) => `${esc(model)} (${tokens(n)} tokens)`).join(', ')}.` : ''

  const subList = subs.map((s) => `${esc(s.name || s.agent)} ${money(s.usd_per_month)}/month${s.since ? ` since ${esc(s.since)}` : ''}`).join(' · ') || 'none listed'
  return `<div class="cv">${tiles}${chart}${monthTable}${projTable}${outTable}
    <p class="note">Subscriptions: ${subList}, from <code>${esc(plan.data.config)}</code>. API-equivalent at each repo's
      factory/config.json prices. Outside the factory: every other Claude Code transcript and Codex session on this
      machine, at this repo's prices; orchestrating sessions count there too. Claude Code deletes transcripts after
      30 days unless <code>cleanupPeriodDays</code> says otherwise, so older months lack that part.${unpricedNote}
      This month's fees count pro rata.</p></div>`
}

// #job=<id> opens that job's drawer (the hub's overview deep-links here). Needs the jobs loaded.
function routeJob() {
  const m = location.hash.match(/^#job=(.+)$/)
  if (!m) return
  const id = decodeURIComponent(m[1])
  if (openJobId !== id && jobs.some((j) => j.id === id)) openDrawer(id)
}

// Under the hub, `hub` answers {repo, overview}; run locally it 404s and nothing changes.
fetch('hub', { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).then((h) => {
  if (!h || !h.overview) return
  hub = h
  $('back').href = h.overview
  $('back').hidden = false
  $('title').innerHTML = `Software Factory · <button type="button" class="switch" id="switch" commandfor="repomenu" command="toggle-popover" aria-haspopup="true" aria-expanded="false" aria-controls="repomenu">${esc(h.repo)} <span class="car" aria-hidden="true">▾</span></button>`
  document.title = h.repo
  // Older browsers lack invoker commands: the button toggles the popover itself.
  if (!('commandForElement' in HTMLButtonElement.prototype)) $('switch').addEventListener('click', () => $('repomenu').togglePopover())
  $('repomenu').addEventListener('toggle', (e) => {
    $('switch')?.setAttribute('aria-expanded', String(e.newState === 'open'))
    if (e.newState === 'open') loadRepos()
  })
}).catch(() => {})

// The repo list comes from the overview, fetched once, the first time the menu opens.
let repoList = null
async function loadRepos() {
  if (repoList) return
  repoList = 'loading'
  const menu = $('repomenu')
  menu.innerHTML = '<div class="note">Loading…</div>'
  try {
    const res = await fetch(new URL('api/overview', new URL(hub.overview, location.href)), { cache: 'no-store' })
    if (!res.ok) throw new Error(`HTTP ${res.status}`)
    const d = await res.json()
    const rank = (r) => [r.counts?.needs_you ? 1 : 0, r.counts?.running ? 1 : 0]
    const repos = [...d.repos].sort((a, b) => { const x = rank(a), y = rank(b); return y[0] - x[0] || y[1] - x[1] || a.repo.localeCompare(b.repo) })
    const safe = (h) => /^\/(?!\/)/.test(String(h || ''))
    const item = (r) => {
      const [o, ...n] = String(r.repo).split('/')
      const c = r.counts || {}
      return `<a href="${safe(r.href) ? esc(r.href) : '#'}" ${r.repo === hub.repo ? 'aria-current="page"' : ''}>
        <span class="rn2">${n.length ? `<span class="dim">${esc(o)}/</span>${esc(n.join('/'))}` : esc(o)}</span>
        <span class="cnt">${c.running ? `<span class="run">${c.running} running</span>` : ''}${c.needs_you ? `<span class="att">${c.needs_you} needs you</span>` : ''}${!c.running && !c.needs_you ? '<span>idle</span>' : ''}</span></a>`
    }
    const all = esc(new URL('all/dashboard.html', new URL(hub.overview, location.href)).pathname)
    menu.innerHTML = repos.map(item).join('') + `<hr><a href="${all}"><span class="rn2">All repos together</span></a>`
    repoList = repos
  } catch (err) {
    repoList = null
    menu.innerHTML = `<div class="note">Can't load the repos: ${esc(err.message)}</div>`
  }
}

window.addEventListener('hashchange', () => { render(); routeJob() })
poll()
setInterval(poll, POLL_MS)
</script>
</body>
