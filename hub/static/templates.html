<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Template versions · Factory</title>
<style>
  :root {
    --bg: #14151b;
    --panel: #1a1c24;
    --card: #20222c;
    --card-hover: #252835;
    --line: #2b2e3b;
    --text: #e4e5ea;
    --muted: #a3a8bd;
    --subtle: #969bb1;
    --active: #8be9fd;
    --changes: #ffb86c;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, Inter, "Segoe UI", sans-serif; }
  [hidden] { display: none !important; }
  :where(a, [tabindex]):focus-visible { outline: 2px solid var(--active); outline-offset: 2px; }
  main { max-width: 1400px; margin: 0 auto; padding: 12px clamp(14px, 3vw, 32px) 40px; }
  .nav-on #fallback-title { display: none; }
  .table-scroll { overflow: auto; max-block-size: 72vh; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  table { width: 100%; min-inline-size: 48rem; border-spacing: 0; font-variant-numeric: tabular-nums; }
  caption { padding: 12px 14px; color: var(--muted); text-align: start; }
  thead { position: sticky; inset-block-start: 0; z-index: 2; }
  th, td { padding: 10px 14px; border-block-start: 1px solid var(--line); text-align: end; }
  thead th { background: var(--card); color: var(--muted); font-size: 13px; font-weight: 600; }
  th:first-child { text-align: start; position: sticky; inset-inline-start: 0; }
  tbody th { z-index: 1; background: var(--panel); font-weight: 500; }
  tbody tr:hover > * { background: var(--card-hover); }
  code { font-family: var(--mono); font-size: 13px; }
  .table-scroll a { display: inline-block; min-block-size: 24px; color: var(--active); }
  .version-note { display: block; color: var(--changes); font-size: 12px; white-space: nowrap; }
  .date { color: var(--subtle); white-space: nowrap; }
  #status { color: var(--muted); margin: 0; padding: 10px 0; }
</style>
</head>
<body>
<main>
  <h1 id="fallback-title">Template versions</h1>
  <p id="status" role="status">Loading template versions…</p>
  <div class="table-scroll" role="region" aria-labelledby="comparison-caption" tabindex="0" hidden>
    <table>
      <caption id="comparison-caption">Merged and rejected jobs</caption>
      <thead>
        <tr>
          <th scope="col">Template</th>
          <th scope="col">Commit date</th>
          <th scope="col">Jobs</th>
          <th scope="col">Median rounds</th>
          <th scope="col">Needs human or paused</th>
          <th scope="col">Median wait (min)</th>
          <th scope="col">Gate failed</th>
          <th scope="col">Median cost</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</main>
<script src="/static/nav.js"></script>
<script type="module">
const repo = new URLSearchParams(location.search).get('repo')
const status = document.querySelector('#status')
const scroll = document.querySelector('.table-scroll')
const rows = document.querySelector('tbody')
const decimal = new Intl.NumberFormat('en-US', { maximumFractionDigits: 1 })
const percent = new Intl.NumberFormat('en-US', { style: 'percent', maximumFractionDigits: 1 })
const usd = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' })

function renderVersion(version) {
  const row = document.createElement('tr')
  const header = document.createElement('th')
  header.scope = 'row'
  if (version.template_commit) {
    const commit = document.createElement('code')
    commit.textContent = version.template_commit.slice(0, 12)
    commit.title = version.template_commit
    if (version.commit_url) {
      const link = document.createElement('a')
      link.href = version.commit_url
      link.setAttribute('aria-label', 'View commit ' + version.template_commit + ' on GitHub')
      link.append(commit)
      header.append(link)
    } else {
      header.append(commit)
    }
  } else {
    header.textContent = 'unknown'
  }
  if (version.too_few_to_compare) {
    const note = document.createElement('span')
    note.className = 'version-note'
    note.textContent = 'too few to compare'
    header.append(note)
  }
  row.append(header)
  const date = row.insertCell()
  date.className = 'date'
  date.textContent = version.template_date?.slice(0, 10) || '—'
  for (const value of [
    decimal.format(version.jobs),
    decimal.format(version.median_rounds),
    percent.format(version.human_wait_share),
    decimal.format(version.median_wait_minutes),
    percent.format(version.gate_failure_share),
    usd.format(version.median_cost_usd),
  ]) {
    row.insertCell().textContent = value
  }
  return row
}

async function loadVersions() {
  try {
    const url = new URL('/api/template-versions', location.href)
    if (repo) url.searchParams.set('repo', repo)
    const response = await fetch(url)
    if (!response.ok) throw new Error(response.status === 404 ? 'Project not found.' : 'Could not load template versions.')
    const { versions } = await response.json()
    rows.replaceChildren(...versions.map(renderVersion))
    scroll.hidden = versions.length === 0
    status.hidden = !scroll.hidden
    status.textContent = scroll.hidden ? 'No finished jobs yet.' : ''
  } catch (error) {
    status.textContent = error.message
    window.FactoryNav?.pageError(error.message)
  }
}
loadVersions()
</script>
</body>
</html>
