name: factory tests

on:
  pull_request:
    paths:
      - 'factory/**'
      - '.github/workflows/factory-tests.yml'
  push:
    branches: [main]
    paths:
      - 'factory/**'
      - '.github/workflows/factory-tests.yml'

permissions:
  contents: read

jobs:
  test:
    name: Factory tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: factory/tests/check.sh
